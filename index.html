<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://iazvoxejpizdaithkqof.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Scpe8NZ9lOyH4asc53h9wQ_1S-fWToe";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   USTAWIENIA
   ========================================================= */

const MIN_YEAR = 2024;
const MAX_YEAR = 2035;

const monthNames = [
    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"
];

const dayNames = [
    "Niedziela",
    "Poniedziałek",
    "Wtorek",
    "Środa",
    "Czwartek",
    "Piątek",
    "Sobota"
];

const types = [
    "Praca",
    "Delegacja",
    "Urlop",
    "L4",
    "Święto",
    "Wolne"
];

let currentYear =
    new Date().getFullYear();

let selectedDates =
    new Set();

let syncing = false;

let syncTimer = null;


/* =========================================================
   BELKA
   ========================================================= */

function updateTopLayout() {

    const topbar =
        document.getElementById("topbar");

    if (!topbar) {
        return;
    }

    const height =
        topbar.offsetHeight;

    document.documentElement.style.setProperty(
        "--topbar-height",
        height + "px"
    );
}

window.addEventListener(
    "resize",
    updateTopLayout
);


/* =========================================================
   MENU MOBILE
   ========================================================= */

function toggleMoreMenu(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    const button =
        document.querySelector(
            ".moreButton"
        );

    const menu =
        document.getElementById(
            "moreDropdown"
        );

    if (!button || !menu) {
        return;
    }

    const isOpen =
        menu.classList.contains("show");

    if (isOpen) {

        closeMoreMenu();

        return;
    }

    menu.classList.add("show");

    positionMoreMenu();
}


function positionMoreMenu() {

    const button =
        document.querySelector(
            ".moreButton"
        );

    const menu =
        document.getElementById(
            "moreDropdown"
        );

    if (!button || !menu) {
        return;
    }

    const rect =
        button.getBoundingClientRect();

    const menuWidth =
        menu.offsetWidth;

    const menuHeight =
        menu.offsetHeight;

    let left =
        rect.right - menuWidth;

    let top =
        rect.bottom + 5;

    if (left < 5) {
        left = 5;
    }

    if (
        left + menuWidth >
        window.innerWidth - 5
    ) {

        left =
            window.innerWidth -
            menuWidth -
            5;
    }

    if (
        top + menuHeight >
        window.innerHeight - 5
    ) {

        top =
            rect.top -
            menuHeight -
            5;
    }

    if (top < 5) {
        top = 5;
    }

   ========================================================= */

function getStorageKey(year) {

    return `worktime_${year}`;
}


function getMetaKey(year) {

    return `worktime_meta_${year}`;
}


function loadYear(year) {

    try {

        const raw =
            localStorage.getItem(
                getStorageKey(year)
            );

        if (!raw) {
            return {};
        }

        return JSON.parse(raw);

    } catch (e) {

        console.error(e);

        return {};
    }
}


function saveYear(year, data) {

    localStorage.setItem(
        getStorageKey(year),
        JSON.stringify(data)
    );
}


function loadMeta(year) {

            localStorage.getItem(
                getMetaKey(year)
            );

        }

    } catch (e) {

}

/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizeDay(value) {

    value =
        value || {};

    return {

        from:
            value.from ?? "",

        to:
            value.to ?? "",

        type:
            value.type ?? "",

        project:
            value.project ?? "",

        note:
            value.note ?? ""
    };
}


/* =========================================================
   DATA
   ========================================================= */

function dateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function daysInMonth(year, month) {

    return new Date(
        year,
        month + 1,
        0
    ).getDate();
}


/* =========================================================
   PODSUMOWANIE MIESIĄCA
   ========================================================= */

function calculateMonthSummary(
    data,
    year,
    month
) {

    let workMinutes = 0;

    let delegation = 0;
    let vacation = 0;
    let sick = 0;
    let holiday = 0;
    let free = 0;

    const days =
        daysInMonth(
            year,
            month
        );

    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            new Date(
                year,
                month,
                day
            );

        const key =
            dateKey(date);

        const d =
            normalizeDay(
                data[key]
            );

        if (
            d.from &&
            d.to
        ) {

            const from =
                timeToMinutes(
                    d.from
                );

            const to =
                timeToMinutes(
                    d.to
                );

            if (
                to >= from
            ) {

                workMinutes +=
                    to - from;
            }
        }

        switch (d.type) {

            case "Delegacja":
                delegation++;
                break;

            case "Urlop":
                vacation++;
                break;

            case "L4":
                sick++;
                break;

            case "Święto":
                holiday++;
                break;

            case "Wolne":
                free++;
                break;
        }
    }

    return {

        workMinutes,
        delegation,
        vacation,
        sick,
        holiday,
        free,

        total:
            delegation +
            vacation +
            sick +
            holiday +
            free
    };
}

/* =========================================================
   CZAS
   ========================================================= */

function timeToMinutes(value) {

    if (!value) {
        return 0;
    }

    const parts =
        value.split(":");

    if (
        parts.length !== 2
    ) {
        return 0;
    }

    const h =
        Number(parts[0]);

    const m =
        Number(parts[1]);

    if (
        Number.isNaN(h) ||
        Number.isNaN(m)
    ) {
        return 0;
    }

    return h * 60 + m;
}


function minutesToTime(minutes) {

    const h =
        Math.floor(
            minutes / 60
        );

    const m =
        minutes % 60;

    return `${h}:${String(m).padStart(2, "0")}`;
}

function updateSelectedCount() {

function updateSelectAllButton() {

        );

        document.querySelectorAll(
            "#app tbody tr"
        );

        return;
    }

    let allSelected = true;

    rows.forEach(
        tr => {

            const checkbox =
                tr.querySelector(
                    'input[type="checkbox"]'
                );

            if (
                checkbox &&
                !checkbox.checked
            ) {

                allSelected = false;
            }
        }
    );

    button.textContent =
        allSelected
            ? "☑️ Odznacz"
            : "☑️ Zaznacz";
}


function toggleSelectAll() {

    const rows =
        document.querySelectorAll(
            "#app tbody tr"
        );

    if (rows.length === 0) {
        return;
    }


    let allSelected = true;


    rows.forEach(
        tr => {

            const checkbox =
                tr.querySelector(
                    'input[type="checkbox"]'
                );

            if (
                checkbox &&
                !checkbox.checked
            ) {

                allSelected = false;
            }
        }
    );


    if (allSelected) {

        selectedDates.clear();

    } else {

        rows.forEach(
            tr => {

                const checkbox =
                    tr.querySelector(
                        'input[type="checkbox"]'
                    );

                if (!checkbox) {
                    return;
                }

                const dateCell =
                    tr.children[1];

                if (!dateCell) {
                    return;
                }

                const key =
                    dateCell.textContent.trim();

                if (key) {
                    selectedDates.add(key);
                }
            }
        );
    }


    rows.forEach(
        tr => {

            const checkbox =
                tr.querySelector(
                    'input[type="checkbox"]'
                );

            if (!checkbox) {
                return;
            }

            const dateCell =
                tr.children[1];

            if (!dateCell) {
                return;
            }

            const key =
                dateCell.textContent.trim();

            const checked =
                selectedDates.has(key);

            checkbox.checked =
                checked;

            tr.classList.toggle(
                "selectedRow",
                checked
            );
        }
    );


    updateSelectedCount();

    updateSelectAllButton();
}


function clearSelected() {

    selectedDates.clear();

    document
        .querySelectorAll(
            "#app tbody tr"
        )
        .forEach(
            tr => {

                const checkbox =
                    tr.querySelector(
                        'input[type="checkbox"]'
                    );

                if (checkbox) {
                    checkbox.checked =
                        false;
                }

                tr.classList.remove(
                    "selectedRow"
                );
            }
        );

    updateSelectedCount();

    updateSelectAllButton();
}

    document.getElementById(
        "bulkNote"
    ).value = "";


    document.getElementById(
        "editModal"
    ).style.display =
        "flex";
}


function closeBulkModal() {

    document.getElementById(
        "editModal"
    ).style.display =
        "none";
}


function applyBulkEdit() {

    const data =
        loadYear(currentYear);


    const type =
        document.getElementById(
            "bulkType"
        ).value;

    const from =
    document.getElementById("bulkFrom").value;

    const to =
    document.getElementById("bulkTo").value;

    const project =
        document.getElementById(
            "bulkProject"
        ).value;


    const note =
        document.getElementById(
            "bulkNote"
        ).value;


    selectedDates.forEach(
        key => {

            const d =
                normalizeDay(
                    data[key]
                );


            if (type) {
                d.type = type;
            }

            if (from !== "") {
                d.from = from;
            }

            if (to !== "") {
                 d.to = to;
            }

            if (project !== "") {
                d.project = project;
            }

            if (note !== "") {
                d.note = note;
            }


            data[key] = d;


            markLocalChange(
                currentYear,
                key
            );
        }
    );


    saveYear(
        currentYear,
        data
    );


    closeBulkModal();

    render();

    setSyncPending();

    scheduleSync();
}

        );

    select.innerHTML = "";


    for (

        year <= MAX_YEAR;
        year++
    ) {

function goToday() {

    const today =
        new Date();


    if (

        today.getFullYear() <= MAX_YEAR

        currentYear =

    setTimeout(

                    behavior:

                });

    );

/* =========================================================
   AUTOMATYCZNA SYNCHRONIZACJA
   ========================================================= */

function scheduleSync() {

    clearTimeout(
        syncTimer
    );

    syncTimer =
        setTimeout(
            () => {

                syncAll(false);

            },
            1000
        );
}


/* =========================================================
   WYSYŁANIE JEDNEGO DNIA
   ========================================================= */

async function pushDay(
    year,
    key
) {

    const userResult =
        await supabaseClient.auth.getUser();

    const user =
        userResult.data.user;

    if (!user) {
        throw new Error(
            "Brak zalogowanego użytkownika."
        );
    }

    const yearData =
        loadYear(year);

    const day =
        normalizeDay(
            yearData[key]
        );

    const meta =
        loadMeta(year);

    /*
     * Każdy lokalny wpis musi mieć własny timestamp.
     * Jest on używany do zasady:
     * "ostatnia zmiana wygrywa".
     */
    let localModified =
        Number(
            meta[key] || 0
        );

    if (!localModified) {

        localModified =
            Date.now();

        meta[key] =
            localModified;

        saveMeta(
            year,
            meta
        );
    }

    /*
     * Tabela Supabase ma strukturę:
     *
     * user_id     uuid
     * entry_date  date
     * data        jsonb
     * modified_at timestamptz
     *
     * Cały zapis dnia znajduje się w polu "data".
     */
    const payload = {

        user_id:
            user.id,

        entry_date:
            key,

        data:
            day,

        modified_at:
            new Date(
                localModified
            ).toISOString()
    };

    console.log(
        "Wysyłanie do Supabase:",
        payload
    );


const { data: result, error } = await supabaseClient.rpc(
    "sync_worktime_entry",
    {
        p_entry_date: key,
        p_data: day,
        p_modified_at: new Date(localModified).toISOString()
    }
);

if (error) {
    console.error(
        "Błąd RPC sync_worktime_entry:",
        JSON.stringify(error, null, 2)
    );
    throw error;
}

    console.log(
        "RPC zakończone:",
        result
    );

    return result;
}


/* =========================================================
   GŁÓWNA SYNCHRONIZACJA
   ========================================================= */

async function syncAll(
    showMessage = true
) {

    if (syncing) {
        return;
    }

    syncing = true;

    try {

        const userResult =
            await supabaseClient.auth.getUser();

        const user =
            userResult.data.user;

        if (!user) {

            throw new Error(
                "Brak zalogowanego użytkownika."
            );
        }

        if (showMessage) {

            document.getElementById(
                "savedInfo"
            ).textContent =
                "Synchronizacja...";
        }

        /*
         * Pobieramy wszystkie rekordy użytkownika
         * JEDNYM zapytaniem.
         *
         * Nie filtrujemy po roku w Supabase,
         * ponieważ rok nie jest osobną kolumną.
         */
        const {
            data: remoteRows,
            error: remoteError
        } =
            await supabaseClient
                .from("worktime_entries")
                .select(
                    "user_id, entry_date, data, modified_at"
                )
                .eq(
                    "user_id",
                    user.id
                );

        if (remoteError) {

            console.error(
                "Błąd pobierania danych z Supabase:",
                remoteError
            );

            throw remoteError;
        }

        /*
         * Mapa:
         * "2026-10-08" -> rekord Supabase
         */
        const remoteMap = {};

        (remoteRows || []).forEach(
            row => {

                if (!row.entry_date) {
                    return;
                }

                remoteMap[
                    row.entry_date
                ] = row;
            }
        );

        /*
         * -----------------------------------------------------
         * SCALANIE LOKALNEGO STANU Z SERWEREM
         * -----------------------------------------------------
         *
         * Zasada:
         *
         * localModified > remoteModified
         *     -> wygrywa lokalna zmiana
         *
         * remoteModified > localModified
         *     -> wygrywa serwer
         *
         * brak lokalnego rekordu
         *     -> pobieramy serwer
         *
         * brak serwerowego rekordu
         *     -> wysyłamy lokalny
         */

        for (
            let year = MIN_YEAR;
            year <= MAX_YEAR;
            year++
        ) {

            const localData =
                loadYear(year);

            const localMeta =
                loadMeta(year);

            /*
             * -----------------------------------------------
             * LOKALNE REKORDY
             * -----------------------------------------------
             */
            for (
                const key of Object.keys(
                    localData
                )
            ) {

                const localModified =
                    Number(
                        localMeta[key] || 0
                    );

                const remote =
                    remoteMap[key];

                /*
                 * Lokalny wpis nie istnieje jeszcze
                 * na serwerze.
                 */
                if (!remote) {

                    await pushDay(
                        year,
                        key
                    );

                    /*
                     * Aktualizujemy mapę, aby dalsza część
                     * synchronizacji traktowała go jak
                     * rekord istniejący na serwerze.
                     */
                    remoteMap[key] = {

                        user_id:
                            user.id,

                        entry_date:
                            key,

                        data:
                            normalizeDay(
                                localData[key]
                            ),

                        modified_at:
                            new Date(
                                localModified
                            ).toISOString()
                    };

                    continue;
                }

                const remoteModified =
                    remote.modified_at
                        ? new Date(
                            remote.modified_at
                          ).getTime()
                        : 0;

                /*
                 * LOKALNA ZMIANA JEST NOWSZA
                 */
                if (
                    localModified >
                    remoteModified
                ) {

                    await pushDay(
                        year,
                        key
                    );

                    continue;
                }

                /*
                 * SERWER JEST NOWSZY
                 * albo timestampy są identyczne.
                 *
                 * Przy identycznym czasie wygrywa serwer.
                 */
                localData[key] =
                    normalizeDay(
                        remote.data
                    );

                localMeta[key] =
                    remoteModified;
            }

            /*
             * -----------------------------------------------
             * REKORDY ISTNIEJĄCE TYLKO NA SERWERZE
             * -----------------------------------------------
             */
            for (
                const key of Object.keys(
                    remoteMap
                )
            ) {

                const row =
                    remoteMap[key];

                if (!row.entry_date) {
                    continue;
                }

                const rowYear =
                    Number(
                        String(
                            row.entry_date
                        ).substring(0, 4)
                    );

                if (
                    rowYear !== year
                ) {
                    continue;
                }

                /*
                 * Jeżeli wpisu nie było lokalnie,
                 * pobieramy go z serwera.
                 */
                if (
                    !Object.prototype.hasOwnProperty.call(
                        localData,
                        key
                    )
                ) {

                    localData[key] =
                        normalizeDay(
                            row.data
                        );

                    localMeta[key] =
                        row.modified_at
                            ? new Date(
                                row.modified_at
                              ).getTime()
                            : Date.now();
                }
            }

            saveYear(
                year,
                localData
            );

            saveMeta(
                year,
                localMeta
            );
        }

        /*
         * -----------------------------------------------------
         * KOŃCOWY ODCZYT
         * -----------------------------------------------------
         *
         * Po wszystkich zapisach pobieramy serwer jeszcze raz.
         * Dzięki temu lokalny stan końcowo odpowiada temu,
         * co rzeczywiście zostało zapisane w Supabase.
         */
        const {
            data: finalRows,
            error: finalError
        } =
            await supabaseClient
                .from("worktime_entries")
                .select(
                    "user_id, entry_date, data, modified_at"
                )
                .eq(
                    "user_id",
                    user.id
                );

        if (finalError) {
            throw finalError;
        }

        const finalByYear = {};

        (finalRows || []).forEach(
            row => {

                if (!row.entry_date) {
                    return;
                }

                const rowYear =
                    Number(
                        String(
                            row.entry_date
                        ).substring(0, 4)
                    );

                if (
                    rowYear < MIN_YEAR ||
                    rowYear > MAX_YEAR
                ) {
                    return;
                }

                if (
                    !finalByYear[rowYear]
                ) {
                    finalByYear[rowYear] = [];
                }

                finalByYear[rowYear].push(
                    row
                );
            }
        );

        /*
         * Ustawiamy lokalny cache zgodnie
         * z końcowym stanem serwera.
         */
        for (
            let year = MIN_YEAR;
            year <= MAX_YEAR;
            year++
        ) {

            const rows =
                finalByYear[year] || [];

            const data =
                loadYear(year);

            const meta =
                loadMeta(year);

            rows.forEach(
                row => {

                    if (!row.entry_date) {
                        return;
                    }

                    const key =
                        row.entry_date;

                    data[key] =
                        normalizeDay(
                            row.data
                        );

                    meta[key] =
                        row.modified_at
                            ? new Date(
                                row.modified_at
                              ).getTime()
                            : Date.now();
                }
            );

            saveYear(
                year,
                data
            );

            saveMeta(
                year,
                meta
            );
        }

        render();

        setSyncSuccess();

        document.getElementById(
            "savedInfo"
        ).textContent =
            "Dane zapisane i zsynchronizowane";

    } catch (e) {

        console.error(
            "Synchronizacja:",
            e
        );

        setSyncError();

        document.getElementById(
            "savedInfo"
        ).textContent =
            "Błąd synchronizacji — dane lokalne zachowane";

    } finally {

        syncing = false;
    }
}


/* =========================================================
   BACKUP
   ========================================================= */

function backupData() {

    const backup = {

        created:
            new Date().toISOString(),

        years: {}
    };


    for (
        let year = MIN_YEAR;
        year <= MAX_YEAR;
        year++
    ) {

        backup.years[year] = {

            data:
                loadYear(year),

            meta:
                loadMeta(year)
        };
    }


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        `ewidencja_czasu_backup_${new Date().toISOString().slice(0,10)}.json`;

    a.click();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   RESTORE
   ========================================================= */

function restoreData() {

    const input =
        document.createElement(
            "input"
        );

    input.type =
        "file";

    input.accept =
        ".json,application/json";


    input.onchange =
        async () => {

            const file =
                input.files[0];

            if (!file) {
                return;
            }


            try {

                const text =
                    await file.text();

                const backup =
                    JSON.parse(text);


                if (
                    !backup.years
                ) {

                    throw new Error(
                        "Nieprawidłowy plik backupu."
                    );
                }


                if (
                    !confirm(
                        "Przywrócić dane z backupu?"
                    )
                ) {
                    return;
                }


                Object.keys(
                    backup.years
                ).forEach(
                    year => {

                        if (
                            backup.years[year].data
                        ) {

                            saveYear(
                                Number(year),
                                backup.years[year].data
                            );
                        }


                        if (
                            backup.years[year].meta
                        ) {

                            saveMeta(
                                Number(year),
                                backup.years[year].meta
                            );
                        }
                    }
                );


                render();

                setSyncPending();

                scheduleSync();


            } catch (e) {

                alert(
                    "Nie udało się przywrócić backupu:\n" +
                    e.message
                );
            }
        };


    input.click();
}


/* =========================================================
   EXCEL
   ========================================================= */

async function exportExcel() {

    const workbook =
        new ExcelJS.Workbook();

    const data =
        loadYear(currentYear);


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const sheet =
            workbook.addWorksheet(
                monthNames[month]
            );


        sheet.columns = [

            {
                header: "Data",
                key: "date",
                width: 14
            },

            {
                header: "Dzień",
                key: "day",
                width: 15
            },

            {
                header: "Od",
                key: "from",
                width: 10
            },

            {
                header: "Do",
                key: "to",
                width: 10
            },

            {
                header: "Rodzaj",
                key: "type",
                width: 15
            },

            {
                header: "Projekt",
                key: "project",
                width: 25
            },

            {
                header: "Uwagi",
                key: "note",
                width: 40
            }
        ];


        const count =
            daysInMonth(
                currentYear,
                month
            );


        for (
            let day = 1;
            day <= count;
            day++
        ) {

            const date =
                new Date(
                    currentYear,
                    month,
                    day
                );

            const key =
                dateKey(date);

            const d =
                normalizeDay(
                    data[key]
                );


            sheet.addRow({

                date:
                    key,

                day:
                    dayNames[
                        date.getDay()
                    ],

                from:
                    d.from,

                to:
                    d.to,

                type:
                    d.type,

                project:
                    d.project,

                note:
                    d.note
            });
        }


        sheet.getRow(1).font = {
            bold: true
        };

        sheet.views = [
            {
                state: "frozen",
                ySplit: 1
            }
        ];
    }


    const buffer =
        await workbook.xlsx.writeBuffer();


    const blob =
        new Blob(
            [buffer],
            {
                type:
                    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        `ewidencja_czasu_${currentYear}.xlsx`;

    a.click();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   START
   ========================================================= */

async function startApplication() {

    const today =
        new Date();


    if (
        today.getFullYear() >= MIN_YEAR &&
        today.getFullYear() <= MAX_YEAR
    ) {

        currentYear =
            today.getFullYear();
    }


    fillYears();

    selectedDates.clear();

    render();

    updateTopLayout();


    await syncAll(false);


    setTimeout(
        () => {

            const todayRow =
                document.querySelector(
                    "#app .today"
                );

            if (todayRow) {

                todayRow.scrollIntoView({

                    behavior:
                        "auto",

                    block:
                        "center"
                });
            }


            updateTopLayout();

        },
        150
    );
}


/* =========================================================
   INIT
   ========================================================= */

(async function init() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        document.getElementById(
            "loginScreen"
        ).style.display =
            "none";

        document.getElementById(
            "application"
        ).style.display =
            "block";


        await startApplication();

    } else {

        document.getElementById(
            "loginScreen"
        ).style.display =
            "flex";
    }


    setTimeout(
        updateTopLayout,

    );

})();
