<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ewidencja czasu pracy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<style>
:root {
    --topbar-height: 58px;
    --summary-height: 50px;
    --header-offset: 118px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding-top: calc(var(--topbar-height) + var(--summary-height) + 10px);
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* =========================================================
   GÓRNA BELKA
   ========================================================= */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;

    min-height: 58px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px 10px;

    background: #222;
    color: white;

    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}

.topbar button,
.topbar select {
    height: 36px;
    border: 1px solid #666;
    border-radius: 5px;
    background: #333;
    color: white;
    padding: 0 10px;
    cursor: pointer;
}

.topbar button:hover,
.topbar select:hover {
    background: #444;
}

.topbar select {
    min-width: 100px;
}

.spacer {
    flex: 1;
}

.userInfo {
    white-space: nowrap;
    font-size: 13px;
    color: #ddd;
}

/* =========================================================
   PODSUMOWANIE
   ========================================================= */

.summary {
    position: fixed;
    top: var(--topbar-height);
    left: 0;
    right: 0;

    z-index: 999;

    display: flex;
    flex-wrap: wrap;
    align-items: stretch;

    gap: 5px;

    padding: 5px 8px;

    background: white;
    border-bottom: 1px solid #ccc;

    box-shadow: 0 2px 5px rgba(0,0,0,.12);
}

.summaryCard {
    min-width: 85px;

    flex: 1 1 85px;

    padding: 4px 8px;

    text-align: center;

    border: 1px solid #ddd;
    border-radius: 5px;

    background: #fafafa;

    line-height: 1.15;
}

.summaryLabel {
    display: block;
    font-size: 11px;
    color: #666;
}

.summaryValue {
    display: block;
    font-size: 16px;
    font-weight: bold;
}

.summarySaved {
    display: flex;
    align-items: center;
    justify-content: center;

    min-width: 110px;

    padding: 4px 8px;

    font-size: 11px;
    color: #555;
}

/* =========================================================
   GŁÓWNA ZAWARTOŚĆ
   ========================================================= */

#app {
    width: 100%;
}

.monthContainer {
    margin: 12px 8px 20px 8px;

    background: white;

    border: 1px solid #ccc;
    border-radius: 6px;

    overflow: hidden;
}

.monthTitle {
    padding: 8px 10px;

    background: #333;
    color: white;

    font-size: 16px;
    font-weight: bold;
}

/* =========================================================
   TABELA
   ========================================================= */

.tableWrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th,
td {
    border: 1px solid #ddd;
    padding: 4px 5px;
    font-size: 13px;
}

th {
    position: sticky;
    top: var(--header-offset);

    z-index: 20;

    background: #e8e8e8;

    font-weight: bold;
    text-align: center;
}

td {
    background: white;
}

td.center {
    text-align: center;
}

/* szerokości kolumn */

th:nth-child(1),
td:nth-child(1) {
    width: 38px;
}

th:nth-child(2),
td:nth-child(2) {
    width: 90px;
}

th:nth-child(3),
td:nth-child(3) {
    width: 75px;
}

th:nth-child(4),
td:nth-child(4) {
    width: 70px;
}

th:nth-child(5),
td:nth-child(5) {
    width: 70px;
}

th:nth-child(6),
td:nth-child(6) {
    width: 110px;
}

th:nth-child(7),
td:nth-child(7) {
    width: 170px;
}

th:nth-child(8),
td:nth-child(8) {
    width: auto;
}

/* =========================================================
   INPUTY
   ========================================================= */

input[type="time"],
input[type="text"],
select {
    width: 100%;
    height: 30px;

    border: 1px solid #ccc;
    border-radius: 4px;

    padding: 3px 5px;

    font-size: 13px;
}

input[type="checkbox"] {
    width: 17px;
    height: 17px;
}

/* =========================================================
   DZISIAJ
   ========================================================= */

.today {
    outline: 3px solid #2196f3;
    outline-offset: -3px;
}

.today td {
    background: #eaf4ff;
}

/* =========================================================
   URLOP
   ========================================================= */

.vacationDay td {
    background: #fff3cd !important;
}

.vacationDay.selectedRow td {
    background: #fff3cd !important;
}

/* =========================================================
   ZAZNACZENIE
   ========================================================= */

.selectedRow td {
    background: #eef5ff !important;
}

/* Urlop ma mieć priorytet nad zaznaczeniem */
.selectedRow.vacationDay td {
    background: #fff3cd !important;
}

/* =========================================================
   LOGOWANIE
   ========================================================= */

#loginScreen {
    position: fixed;
    inset: 0;

    z-index: 5000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f5f5f5;
}

.loginBox {
    width: min(380px, calc(100% - 30px));

    padding: 25px;

    background: white;

    border: 1px solid #ccc;
    border-radius: 8px;

    box-shadow: 0 4px 20px rgba(0,0,0,.15);
}

.loginBox h2 {
    margin-top: 0;
    text-align: center;
}

.loginBox input {
    width: 100%;
    height: 40px;

    margin-bottom: 10px;

    padding: 8px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

.loginBox button {
    width: 100%;
    height: 40px;

    margin-top: 5px;

    border: 0;
    border-radius: 5px;

    background: #1976d2;
    color: white;

    cursor: pointer;
}

.loginBox button:hover {
    background: #1565c0;
}

.loginMessage {
    min-height: 20px;
    margin-top: 10px;

    text-align: center;

    color: #c00;
    font-size: 13px;
}

/* =========================================================
   MODALE
   ========================================================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 4000;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.45);
}

.modalBox {
    width: min(500px, calc(100% - 30px));

    max-height: 90vh;
    overflow: auto;

    padding: 20px;

    background: white;

    border-radius: 8px;
}

.modalBox h3 {
    margin-top: 0;
}

.modalButtons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;

    margin-top: 15px;
}

.modalButtons button {
    padding: 8px 14px;

    border: 1px solid #bbb;
    border-radius: 5px;

    background: #eee;

    cursor: pointer;
}

/* =========================================================
   PRZYCISKI
   ========================================================= */

.danger {
    background: #b71c1c !important;
}

.success {
    background: #2e7d32 !important;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .topbar {
        min-height: 0;

        flex-wrap: wrap;

        padding: 6px;

        gap: 5px;
    }

    .topbar button,
    .topbar select {
        height: 34px;

        padding: 0 7px;

        font-size: 12px;
    }

    .userInfo {
        width: 100%;
        order: 20;

        font-size: 11px;
        text-align: right;
    }

    .summary {
        gap: 3px;
        padding: 4px;
    }

    .summaryCard {
        min-width: 70px;
        flex: 1 1 70px;

        padding: 3px 4px;
    }

    .summaryLabel {
        font-size: 9px;
    }

    .summaryValue {
        font-size: 14px;
    }

    .summarySaved {
        min-width: 80px;
        font-size: 9px;
    }

    .monthContainer {
        margin-left: 4px;
        margin-right: 4px;
    }

    .monthTitle {
        font-size: 14px;
    }

    th,
    td {
        font-size: 12px;
    }

    th:nth-child(2),
    td:nth-child(2) {
        width: 80px;
    }

    th:nth-child(3),
    td:nth-child(3) {
        width: 60px;
    }

    th:nth-child(4),
    td:nth-child(4),
    th:nth-child(5),
    td:nth-child(5) {
        width: 65px;
    }

    th:nth-child(6),
    td:nth-child(6) {
        width: 95px;
    }

    th:nth-child(7),
    td:nth-child(7) {
        width: 140px;
    }

    th:nth-child(8),
    td:nth-child(8) {
        width: 180px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     EKRAN LOGOWANIA
     ========================================================= -->

<div id="loginScreen">

    <div class="loginBox">

        <h2>Ewidencja czasu pracy</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="E-mail"
            autocomplete="username"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Hasło"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Zaloguj
        </button>

        <button onclick="registerUser()">
            Rejestracja
        </button>

        <div id="loginMessage" class="loginMessage"></div>

    </div>

</div>


<!-- =========================================================
     APLIKACJA
     ========================================================= -->

<div id="application" style="display:none;">

    <div class="topbar" id="topbar">

        <button onclick="goToday()">
            Dzisiaj
        </button>

        <select id="yearSelect" onchange="changeYear(this.value)">
        </select>

        <button onclick="selectAllVisible()">
            Zaznacz
        </button>

        <button onclick="clearSelected()">
            Wyczyść
        </button>

        <button onclick="bulkEdit()">
            Ustaw dla zaznaczonych
        </button>

        <button onclick="backupData()">
            Backup
        </button>

        <button onclick="restoreData()">
            Przywróć
        </button>

        <button onclick="exportExcel()">
            Excel
        </button>

        <div class="spacer"></div>

        <span id="selectedInfo" class="userInfo">
            Zaznaczono: 0
        </span>

        <span id="userEmail" class="userInfo"></span>

        <button onclick="logout()">
            Wyloguj
        </button>

    </div>


    <!-- =====================================================
         PODSUMOWANIE
         ===================================================== -->

    <div class="summary" id="summary">

        <div class="summaryCard">
            <span class="summaryLabel">Przepracowane</span>
            <span class="summaryValue" id="sumWork">0:00</span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">Delegacja</span>
            <span class="summaryValue" id="sumDelegation">0</span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">Urlop</span>
            <span class="summaryValue" id="sumVacation">0</span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">L4</span>
            <span class="summaryValue" id="sumSick">0</span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">Święto</span>
            <span class="summaryValue" id="sumHoliday">0</span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">Wolne</span>
            <span class="summaryValue" id="sumFree">0</span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">Razem</span>
            <span class="summaryValue" id="sumTotal">0</span>
        </div>

        <div class="summarySaved" id="savedInfo">
            Gotowe
        </div>

    <div id="app"></div>

</div>


<!-- =========================================================
     MODAL EDYCJI
     ========================================================= -->

<div class="modal" id="editModal">

    <div class="modalBox">

        <h3>Ustaw dla zaznaczonych</h3>

        <label>
            Rodzaj:
        </label>

        <select id="bulkType">
            <option value="">Bez zmiany</option>
            <option value="Praca">Praca</option>
            <option value="Delegacja">Delegacja</option>
            <option value="Urlop">Urlop</option>
            <option value="L4">L4</option>
            <option value="Święto">Święto</option>
            <option value="Wolne">Wolne</option>
        </select>

        <br><br>

        <label>
            Projekt:
        </label>

        <input
            type="text"
            id="bulkProject"
            placeholder="Bez zmiany"
        >

        <br><br>

        <label>
            Uwagi:
        </label>

        <input
            type="text"
            id="bulkNote"
            placeholder="Bez zmiany"
        >

        <div class="modalButtons">

            <button onclick="closeBulkModal()">
                Anuluj
            </button>

            <button
                class="success"
                onclick="applyBulkEdit()"
            >
                Zastosuj
            </button>

        </div>

    </div>

</div>


<script>
/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://iazvoxejpizdaithkqof.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Scpe8NZ9lOyH4asc53h9wQ_1S-fWToe";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   USTAWIENIA
   ========================================================= */

const MIN_YEAR = 2024;
const MAX_YEAR = 2035;

const monthNames = [
    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"
];

const dayNames = [
    "Niedziela",
    "Poniedziałek",
    "Wtorek",
    "Środa",
    "Czwartek",
    "Piątek",
    "Sobota"
];

const types = [
    "Praca",
    "Delegacja",
    "Urlop",
    "L4",
    "Święto",
    "Wolne"
];

let currentYear =
    new Date().getFullYear();

let selectedDates = new Set();

let syncing = false;


/* =========================================================
   LAYOUT GÓRA + PODSUMOWANIE
   ========================================================= */

function updateTopLayout() {

    const topbar =
        document.getElementById("topbar");

    const summary =
        document.getElementById("summary");

    if (!topbar || !summary) {
        return;
    }

    const topbarHeight =
        topbar.offsetHeight;

    const summaryHeight =
        summary.offsetHeight;

    const headerOffset =
        topbarHeight + summaryHeight;

    document.documentElement.style.setProperty(
        "--topbar-height",
        topbarHeight + "px"
    );

    document.documentElement.style.setProperty(
        "--summary-height",
        summaryHeight + "px"
    );

    document.documentElement.style.setProperty(
        "--header-offset",
        headerOffset + "px"
    );
}

window.addEventListener(
    "resize",
    updateTopLayout
);


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "";

    if (!email || !password) {

        message.textContent =
            "Podaj e-mail i hasło.";

        return;
    }

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        message.textContent =
            error.message;

        return;
    }
}


async function registerUser() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "";

    if (!email || !password) {

        message.textContent =
            "Podaj e-mail i hasło.";

        return;
    }

    const { error } =
        await supabaseClient.auth.signUp({
            email,
            password
        });

    if (error) {

        message.textContent =
            error.message;

        return;
    }

    message.style.color = "#2e7d32";

    message.textContent =
        "Konto zostało utworzone. Sprawdź pocztę, jeśli wymagana jest aktywacja.";
}


async function logout() {

    await supabaseClient.auth.signOut();
}


/* =========================================================
   AUTH STATE
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if (session && session.user) {

            document.getElementById(
                "loginScreen"
            ).style.display = "none";

            document.getElementById(
                "application"
            ).style.display = "block";

            document.getElementById(
                "userEmail"
            ).textContent =
                session.user.email || "";

            await startApplication();

        } else {

            document.getElementById(
                "application"
            ).style.display = "none";

            document.getElementById(
                "loginScreen"
            ).style.display = "flex";

        }

        setTimeout(
            updateTopLayout,
            0
        );
    }
);


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function getStorageKey(year) {

    return `worktime_${year}`;
}


function getMetaKey(year) {

    return `worktime_meta_${year}`;
}


function loadYear(year) {

    try {

        const raw =
            localStorage.getItem(
                getStorageKey(year)
            );

        if (!raw) {
            return {};
        }

        return JSON.parse(raw);

    } catch (e) {

        console.error(
            "Błąd odczytu danych:",
            e
        );

        return {};
    }
}


function saveYear(year, data) {

    localStorage.setItem(
        getStorageKey(year),
        JSON.stringify(data)
    );
}


function loadMeta(year) {

    try {

        const raw =
            localStorage.getItem(
                getMetaKey(year)
            );

        if (!raw) {
            return {};
        }

        return JSON.parse(raw);

    } catch (e) {

        console.error(
            "Błąd odczytu metadanych:",
            e
        );

        return {};
    }
}


function saveMeta(year, data) {

    localStorage.setItem(
        getMetaKey(year),
        JSON.stringify(data)
    );
}


/* =========================================================
   NORMALIZACJA DNIA
   ========================================================= */

function normalizeDay(value) {

    value =
        value || {};

    return {

        from:
            value.from ?? "",

        to:
            value.to ?? "",

        type:
            value.type ?? "",

        project:
            value.project ?? "",

        note:
            value.note ?? ""
    };
}


/* =========================================================
   DATA
   ========================================================= */

function dateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function daysInMonth(year, month) {

    return new Date(
        year,
        month + 1,
        0
    ).getDate();
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    const container =
        document.getElementById("app");

    const data =
        loadYear(currentYear);

    container.innerHTML = "";

    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const monthContainer =
            document.createElement("div");

        monthContainer.className =
            "monthContainer";

        const title =
            document.createElement("div");

        title.className =
            "monthTitle";

        title.textContent =
            `${monthNames[month]} ${currentYear}`;

        monthContainer.appendChild(title);


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "tableWrapper";


        const table =
            document.createElement("table");


        const thead =
            document.createElement("thead");

        const header =
            document.createElement("tr");

        const headers = [
            "✓",
            "Data",
            "Dzień",
            "Od",
            "Do",
            "Rodzaj",
            "Projekt",
            "Uwagi"
        ];

        headers.forEach(text => {

            const th =
                document.createElement("th");

            th.textContent =
                text;

            header.appendChild(th);
        });

        thead.appendChild(header);
        table.appendChild(thead);


        const tbody =
            document.createElement("tbody");


        const count =
            daysInMonth(
                currentYear,
                month
            );


        for (
            let day = 1;
            day <= count;
            day++
        ) {

            const date =
                new Date(
                    currentYear,
                    month,
                    day
                );

            const key =
                dateKey(date);

            const old =
                normalizeDay(
                    data[key]
                );


            const tr =
                document.createElement("tr");


            if (
                key ===
                dateKey(new Date())
            ) {

                tr.classList.add(
                    "today"
                );
            }


            /* ==============================
               URLOP
               ============================== */

            if (
                old.type === "Urlop"
            ) {

                tr.classList.add(
                    "vacationDay"
                );
            }


            if (
                selectedDates.has(key)
            ) {

                tr.classList.add(
                    "selectedRow"
                );
            }


            /* ==============================
               CHECKBOX
               ============================== */

            const tdCheck =
                document.createElement("td");

            tdCheck.className =
                "center";


            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.checked =
                selectedDates.has(key);


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        selectedDates.add(key);

                    } else {

                        selectedDates.delete(key);
                    }

                    tr.classList.toggle(
                        "selectedRow",
                        checkbox.checked
                    );

                    updateSelectedCount();
                }
            );


            tdCheck.appendChild(
                checkbox
            );

            tr.appendChild(tdCheck);


            /* ==============================
               DATA
               ============================== */

            const tdDate =
                document.createElement("td");

            tdDate.className =
                "center";

            tdDate.textContent =
                key;

            tr.appendChild(tdDate);


            /* ==============================
               DZIEŃ
               ============================== */

            const tdDay =
                document.createElement("td");

            tdDay.className =
                "center";

            tdDay.textContent =
                dayNames[
                    date.getDay()
                ];

            tr.appendChild(tdDay);


            /* ==============================
               OD
               ============================== */

            const tdFrom =
                document.createElement("td");

            const from =
                document.createElement("input");

            from.type =
                "time";

            from.value =
                old.from || "";

            tdFrom.appendChild(from);

            tr.appendChild(tdFrom);


            /* ==============================
               DO
               ============================== */

            const tdTo =
                document.createElement("td");

            const to =
                document.createElement("input");

            to.type =
                "time";

            to.value =
                old.to || "";

            tdTo.appendChild(to);

            tr.appendChild(tdTo);


            /* ==============================
               RODZAJ
               ============================== */

            const tdType =
                document.createElement("td");

            const type =
                document.createElement("select");


            const emptyOption =
                document.createElement("option");

            emptyOption.value = "";
            emptyOption.textContent = "";

            type.appendChild(
                emptyOption
            );


            types.forEach(
                typeName => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        typeName;

                    option.textContent =
                        typeName;

                    type.appendChild(
                        option
                    );
                }
            );


            type.value =
                old.type || "";


            tdType.appendChild(
                type
            );

            tr.appendChild(tdType);


            /* ==============================
               PROJEKT
               ============================== */

            const tdProject =
                document.createElement("td");

            const project =
                document.createElement("input");

            project.type =
                "text";

            project.value =
                old.project || "";

            project.placeholder =
                "Projekt";

            tdProject.appendChild(
                project
            );

            tr.appendChild(tdProject);


            /* ==============================
               UWAGI
               ============================== */

            const tdNote =
                document.createElement("td");

            const note =
                document.createElement("input");

            note.type =
                "text";

            note.value =
                old.note || "";

            note.placeholder =
                "Uwagi";

            tdNote.appendChild(
                note
            );

            tr.appendChild(tdNote);


            /* ==============================
               ZAPIS ZMIAN
               ============================== */

            function saveRow() {

                const current =
                    normalizeDay(
                        data[key]
                    );

                current.from =
                    from.value || "";

                current.to =
                    to.value || "";

                current.type =
                    type.value || "";

                current.project =
                    project.value || "";

                current.note =
                    note.value || "";


                data[key] =
                    current;


                saveYear(
                    currentYear,
                    data
                );


                markLocalChange(
                    currentYear,
                    key
                );


                /* natychmiastowa zmiana tła urlopu */

                tr.classList.toggle(
                    "vacationDay",
                    current.type === "Urlop"
                );


                renderSummary();

                document.getElementById(
                    "savedInfo"
                ).textContent =
                    "Niezapisane zmiany";


                scheduleSync();
            }


            from.addEventListener(
                "change",
                saveRow
            );

            to.addEventListener(
                "change",
                saveRow
            );

            type.addEventListener(
                "change",
                saveRow
            );

            project.addEventListener(
                "change",
                saveRow
            );

            note.addEventListener(
                "change",
                saveRow
            );


            tbody.appendChild(tr);
        }


        table.appendChild(tbody);

        wrapper.appendChild(table);

        monthContainer.appendChild(wrapper);

        container.appendChild(
            monthContainer
        );
    }


    renderSummary();

    updateSelectedCount();

    setTimeout(
        updateTopLayout,
        0
    );
}


/* =========================================================
   SUMMARY
   ========================================================= */

function renderSummary() {

    const data =
        loadYear(currentYear);


    let workMinutes = 0;

    let delegation = 0;
    let vacation = 0;
    let sick = 0;
    let holiday = 0;
    let free = 0;


    Object.keys(data).forEach(
        key => {

            const d =
                normalizeDay(
                    data[key]
                );


            if (
                d.from &&
                d.to
            ) {

                const from =
                    timeToMinutes(
                        d.from
                    );

                const to =
                    timeToMinutes(
                        d.to
                    );

                if (
                    to >= from
                ) {

                    workMinutes +=
                        to - from;
                }
            }


            switch (d.type) {

                case "Delegacja":
                    delegation++;
                    break;

                case "Urlop":
                    vacation++;
                    break;

                case "L4":
                    sick++;
                    break;

                case "Święto":
                    holiday++;
                    break;

                case "Wolne":
                    free++;
                    break;
            }
        }
    );


    document.getElementById(
        "sumWork"
    ).textContent =
        minutesToTime(
            workMinutes
        );


    document.getElementById(
        "sumDelegation"
    ).textContent =
        delegation;


    document.getElementById(
        "sumVacation"
    ).textContent =
        vacation;


    document.getElementById(
        "sumSick"
    ).textContent =
        sick;


    document.getElementById(
        "sumHoliday"
    ).textContent =
        holiday;


    document.getElementById(
        "sumFree"
    ).textContent =
        free;


    document.getElementById(
        "sumTotal"
    ).textContent =
        delegation +
        vacation +
        sick +
        holiday +
        free;


    setTimeout(
        updateTopLayout,
        0
    );
}


function timeToMinutes(value) {

    if (!value) {
        return 0;
    }

    const parts =
        value.split(":");

    if (
        parts.length !== 2
    ) {
        return 0;
    }

    const h =
        Number(parts[0]);

    const m =
        Number(parts[1]);

    if (
        Number.isNaN(h) ||
        Number.isNaN(m)
    ) {
        return 0;
    }

    return h * 60 + m;
}


function minutesToTime(minutes) {

    const h =
        Math.floor(
            minutes / 60
        );

    const m =
        minutes % 60;

    return `${h}:${String(m).padStart(2, "0")}`;
}

function selectAllVisible() {

function clearSelected() {

    selectedDates.clear();

    document
        .querySelectorAll(
            "#app tbody tr"

        .forEach(
            tr => {

            "yearSelect"
        );

    for (

/* =========================================================
   DZISIAJ
   ========================================================= */

function scrollToToday(smooth = true) {

    const today =
        new Date();

    const todayYear =
        today.getFullYear();


    if (
        todayYear >= MIN_YEAR &&
        todayYear <= MAX_YEAR
    ) {

        currentYear =
            todayYear;

        const yearSelect =
            document.getElementById(
                "yearSelect"
            );

        if (yearSelect) {
            yearSelect.value =
                currentYear;
        }
    }


    render();


    setTimeout(
        () => {

            const todayRow =
                document.querySelector(
                    "#app .today"
                );

            if (!todayRow) {
                return;
            }


            todayRow.scrollIntoView({

                behavior:
                    smooth
                        ? "smooth"
                        : "auto",

                block:
                    "center"
            });

        },
        100
    );

function goToday() {

}


/* =========================================================
   LOCAL CHANGE META
   ========================================================= */

function markLocalChange(
    year,
    key
) {

    const meta =
        loadMeta(year);

    meta[key] =
        Date.now();

    saveMeta(
        year,
        meta
    );
}


/* =========================================================
   SYNC
   ========================================================= */

let syncTimer = null;


function scheduleSync() {

    clearTimeout(
        syncTimer
    );

    syncTimer =
        setTimeout(
            () => {

                syncAll(false);

            },
            1000
        );
}


async function pushDay(
    year,
    key
) {

    const userResult =
        await supabaseClient.auth.getUser();

    const user =
        userResult.data.user;

    if (!user) {
        return;
    }


    const data =
        loadYear(year);

    const day =
        normalizeDay(
            data[key]
        );

    const meta =
        loadMeta(year);


    const localModified =
        meta[key] ||
        Date.now();


    const payload = {

        user_id:
            user.id,

        work_date:
            key,

        year:
            year,

        from_time:
            day.from || null,

        to_time:
            day.to || null,

        work_type:
            day.type || null,

        project:
            day.project || "",

        note:
            day.note || "",

        modified_at:
            new Date(
                localModified
            ).toISOString()
    };


    const { error } =
        await supabaseClient.rpc(
            "sync_worktime_entry",
            payload
        );


    if (error) {

        console.error(
            "Błąd synchronizacji:",
            error
        );

        throw error;
    }
}


async function syncAll(
    showMessage = true
) {

    if (syncing) {
        return;
    }

    syncing = true;


    try {

        const userResult =
            await supabaseClient.auth.getUser();

        const user =
            userResult.data.user;

        if (!user) {
            return;
        }


        if (showMessage) {

            document.getElementById(
                "savedInfo"
            ).textContent =
                "Synchronizacja...";
        }


        const years = [];

        for (
            let year = MIN_YEAR;
            year <= MAX_YEAR;
            year++
        ) {

            years.push(year);
        }


        for (
            const year of years
        ) {

            const {
                data: remoteRows,
                error
            } =
                await supabaseClient
                    .from("worktime_entries")
                    .select("*")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .eq(
                        "year",
                        year
                    );


            if (error) {

                console.error(
                    "Błąd pobierania:",
                    error
                );

                continue;
            }


            const localData =
                loadYear(year);

            const localMeta =
                loadMeta(year);


            const remoteMap = {};


            (remoteRows || []).forEach(
                row => {

                    remoteMap[
                        row.work_date
                    ] = row;
                }
            );


            /*
             * LAST CHANGE WINS
             *
             * Najpierw porównujemy timestamp
             * lokalny z modified_at z Supabase.
             */

            for (
                const key of Object.keys(
                    localData
                )
            ) {

                const localModified =
                    localMeta[key] || 0;

                const remote =
                    remoteMap[key];


                if (!remote) {

                    try {

                        await pushDay(
                            year,
                            key
                        );

                    } catch (e) {

                        console.error(
                            e
                        );
                    }

                    continue;
                }


                const remoteModified =
                    remote.modified_at
                        ? new Date(
                            remote.modified_at
                          ).getTime()
                        : 0;


                if (
                    localModified >
                    remoteModified
                ) {

                    try {

                        await pushDay(
                            year,
                            key
                        );

                    } catch (e) {

                        console.error(
                            e
                        );
                    }

                } else {

                    localData[key] = {

                        from:
                            remote.from_time || "",

                        to:
                            remote.to_time || "",

                        type:
                            remote.work_type || "",

                        project:
                            remote.project || "",

                        note:
                            remote.note || ""
                    };


                    localMeta[key] =
                        remoteModified;
                }
            }


            /*
             * Rekordy istniejące tylko online
             */

            for (
                const key of Object.keys(
                    remoteMap
                )
            ) {

                if (
                    localData[key]
                ) {
                    continue;
                }


                const remote =
                    remoteMap[key];


                localData[key] = {

                    from:
                        remote.from_time || "",

                    to:
                        remote.to_time || "",

                    type:
                        remote.work_type || "",

                    project:
                        remote.project || "",

                    note:
                        remote.note || ""
                };


                localMeta[key] =
                    remote.modified_at
                        ? new Date(
                            remote.modified_at
                          ).getTime()
                        : Date.now();
            }


            saveYear(
                year,
                localData
            );

            saveMeta(
                year,
                localMeta
            );
        }


        render();


        document.getElementById(
            "savedInfo"
        ).textContent =
            "Zapisane";


    } catch (e) {

        console.error(
            "Synchronizacja:",
            e
        );


        document.getElementById(
            "savedInfo"
        ).textContent =
            "Offline / oczekuje na synchronizację";


    } finally {

        syncing = false;
    }
}


/* =========================================================
   BACKUP
   ========================================================= */

function backupData() {

    const backup = {

        created:
            new Date().toISOString(),

        years: {}

    };


    for (
        let year = MIN_YEAR;
        year <= MAX_YEAR;
        year++
    ) {

        backup.years[year] = {

            data:
                loadYear(year),

            meta:
                loadMeta(year)
        };
    }


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `ewidencja_czasu_backup_${new Date().toISOString().slice(0,10)}.json`;

    a.click();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   RESTORE
   ========================================================= */

function restoreData() {

    const input =
        document.createElement(
            "input"
        );

    input.type =
        "file";

    input.accept =
        ".json,application/json";


    input.onchange =
        async () => {

            const file =
                input.files[0];

            if (!file) {
                return;
            }


            try {

                const text =
                    await file.text();

                const backup =
                    JSON.parse(text);


                if (
                    !backup.years
                ) {

                    throw new Error(
                        "Nieprawidłowy plik backupu."
                    );
                }


                if (
                    !confirm(
                        "Przywrócić dane z backupu?"
                    )
                ) {
                    return;
                }


                Object.keys(
                    backup.years
                ).forEach(
                    year => {

                        if (
                            backup.years[year].data
                        ) {

                            saveYear(
                                Number(year),
                                backup.years[year].data
                            );
                        }


                        if (
                            backup.years[year].meta
                        ) {

                            saveMeta(
                                Number(year),
                                backup.years[year].meta
                            );
                        }
                    }
                );


                render();


                document.getElementById(
                    "savedInfo"
                ).textContent =
                    "Przywrócono backup";

                scheduleSync();


            } catch (e) {

                alert(
                    "Nie udało się przywrócić backupu:\n" +
                    e.message
                );
            }
        };


    input.click();
}


/* =========================================================
   EXCEL
   ========================================================= */

async function exportExcel() {

    const workbook =
        new ExcelJS.Workbook();

    const data =
        loadYear(currentYear);


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const sheet =
            workbook.addWorksheet(
                monthNames[month]
            );


        sheet.columns = [

            {
                header: "Data",
                key: "date",
                width: 14
            },

            {
                header: "Dzień",
                key: "day",
                width: 15
            },

            {
                header: "Od",
                key: "from",
                width: 10
            },

            {
                header: "Do",
                key: "to",
                width: 10
            },

            {
                header: "Rodzaj",
                key: "type",
                width: 15
            },

            {
                header: "Projekt",
                key: "project",
                width: 25
            },

            {
                header: "Uwagi",
                key: "note",
                width: 40
            }
        ];


        const count =
            daysInMonth(
                currentYear,
                month
            );


        for (
            let day = 1;
            day <= count;
            day++
        ) {

            const date =
                new Date(
                    currentYear,
                    month,
                    day
                );

            const key =
                dateKey(date);

            const d =
                normalizeDay(
                    data[key]
                );


            sheet.addRow({

                date:
                    key,

                day:
                    dayNames[
                        date.getDay()
                    ],

                from:
                    d.from,

                to:
                    d.to,

                type:
                    d.type,

                project:
                    d.project,

                note:
                    d.note
            });
        }


        sheet.getRow(1).font = {
            bold: true
        };

        sheet.views = [
            {
                state: "frozen",
                ySplit: 1
            }
        ];
    }


    const buffer =
        await workbook.xlsx.writeBuffer();


    const blob =
        new Blob(
            [buffer],
            {
                type:
                    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `ewidencja_czasu_${currentYear}.xlsx`;

    a.click();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   START
   ========================================================= */

async function startApplication() {

    const today =
        new Date();

    if (
        today.getFullYear() >= MIN_YEAR &&
        today.getFullYear() <= MAX_YEAR
    ) {

        currentYear =
            today.getFullYear();
    }


    fillYears();

    selectedDates.clear();

    render();

    updateTopLayout();


    /*
     * Synchronizacja może ponownie wykonać render(),
     * dlatego przewijamy do dzisiaj dopiero po jej
     * zakończeniu.
     */

    await syncAll(false);


    setTimeout(
        () => {

            const todayRow =
                document.querySelector(
                    "#app .today"
                );

            if (todayRow) {

                todayRow.scrollIntoView({

                    behavior: "auto",

                    block: "center"
                });
            }

            updateTopLayout();

        },
        150
    );
}
