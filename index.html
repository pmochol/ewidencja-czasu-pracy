<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#222;
}

body{
    padding-top:128px;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

#authScreen{
    position:fixed;
    inset:0;
    background:#f4f6f8;
    display:flex;
    align-items:center;
    justify-content:center;

}

.authBox{
    width:380px;
    max-width:calc(100vw - 30px);
    background:white;
    border-radius:12px;

}

.authBox h1{

.authBox p{

.authBox input{

.topbar{

.month{

}

.monthTitle{

}

table{
    width:100%;

    min-width:850px;
}

.tableWrap{
    overflow-x:auto;
}

th,
td{
    border:1px solid #ddd;

}

th{
    background:#f1f3f5;

    top:0;

}

td.date{
    white-space:nowrap;
}

td.day{
    width:35px;
}

td input[type="time"]{
    width:85px;
    padding:3px;
    border:1px solid #ccc;

}

td select{
    padding:3px;
    width:110px;
    border:1px solid #ccc;
    border-radius:4px;
}

td input.project,
td input.note{
    width:100%;
    min-width:120px;
    padding:4px;
    border:1px solid #ccc;
    border-radius:4px;
}

    min-width:180px;
}

.weekend{

}

.today{
    outline:2px solid #2563eb;

}

.selectedRow{
    background:#eef5ff !important;
}

.emptyDay{
    color:#aaa;
}

.bulkPanel{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:1100;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    padding:8px;
    box-shadow:0 3px 15px rgba(0,0,0,.2);
    display:none;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.bulkPanel input,
.bulkPanel select{
    padding:6px;
    border:1px solid #ccc;
    border-radius:5px;
}

.bulkPanel button{
    padding:7px 10px;
    border:0;
    border-radius:5px;
    background:#2563eb;
    color:white;
}

.bulkPanel button.danger{
    background:#dc2626;
}

.statusMessage{
    position:fixed;
    right:15px;
    bottom:15px;
    background:#111827;
    color:white;
    padding:9px 13px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:5000;
    font-size:13px;
}

.statusMessage.show{
    opacity:1;
}

@media(max-width:700px){
    body{
        padding-top:175px;
    }

    .userInfo{
        margin-left:0;
    }

    .summary{
        top:105px;
    }

    .title{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGOWANIE
========================= -->

<div id="authScreen">
    <div class="authBox">

        <h1>Ewidencja czasu pracy</h1>

        <input
            id="authEmail"

            type="password"

    </div>
</div>


<!-- =========================
     APLIKACJA
========================= -->

<div id="app">

    <div class="topbar">

        <div class="topbarRow">

            <span class="title">Ewidencja czasu pracy</span>

            <label>Rok:</label>

            <select id="yearSelect"></select>

            <button onclick="goToday()">📅 Dzisiaj</button>

            <button onclick="showBulkPanel()">
                ☑ Ustaw dla zaznaczonych
            </button>

            <button onclick="clearSelected()">

            </button>

            <button onclick="document.getElementById('restoreFile').click()">

            </button>

            <input
                type="file"

            >

                🔄 Synchronizuj
            </button>

            <span id="syncStatus">

    <div class="summary">

        <div class="card">

            <strong id="sumWork">0:00</strong>

        <div class="card">
            Delegacja:
            <strong id="sumTrip">0:00</strong>
        </div>

        <div class="card">

            <option>Praca</option>
            <option>Delegacja</option>
            <option>Urlop</option>
            <option>L4</option>
            <option>Święto</option>
            <option>Wolne</option>
        </select>

        <label>Projekt:</label>

        <button onclick="applyBulk()">
            Ustaw

            class="danger"
            onclick="hideBulkPanel()"
        >
            Zamknij
        </button>

    </div>

</div>


<div id="statusMessage" class="statusMessage"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://iazvoxejpizdaithkqof.supabaseClient.co";

const SUPABASE_KEY =
    "sb_publishable_Scpe8NZ9lOyH4asc53h9wQ_1S-fWToe";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================================================
   USTAWIENIA
========================================================= */

const FIRST_YEAR = 2024;
const LAST_YEAR  = 2035;

const YEARS = [];

for(let y=FIRST_YEAR; y<=LAST_YEAR; y++){
    YEARS.push(y);
}

const MONTHS = [
    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"
];

const TYPES = [
    "Praca",
    "Delegacja",
    "Urlop",
    "L4",
    "Święto",
    "Wolne"
];

let currentUser = null;
let currentYear = new Date().getFullYear();

if(currentYear < FIRST_YEAR) currentYear = FIRST_YEAR;
if(currentYear > LAST_YEAR) currentYear = LAST_YEAR;

let selectedDays = new Set();
let syncRunning = false;


/* =========================================================
   ELEMENTY
========================================================= */

const ys = document.getElementById("yearSelect");


/* =========================================================
   INICJALIZACJA ROKÓW
========================================================= */

YEARS.forEach(y=>{
    const o = document.createElement("option");
    o.value = y;
    o.textContent = y;

    if(y === currentYear){
        o.selected = true;
    }

    ys.appendChild(o);
});

ys.addEventListener("change",()=>{
    currentYear = Number(ys.value);
    selectedDays.clear();
    render();
});


/* =========================================================
   LOCAL STORAGE
========================================================= */

function dataKey(year){
    return "worktime_" + year;
}

function metaKey(year){
    return "worktime_meta_" + year;
}

function readYear(year){

    try{

        const raw = localStorage.getItem(dataKey(year));

        if(!raw){
            return {};
        }

        const d = JSON.parse(raw);

        return d && typeof d === "object"
            ? d
            : {};

    }catch(e){

        console.error(e);
        return {};

    }
}


function writeYear(year,d){

    localStorage.setItem(
        dataKey(year),
        JSON.stringify(d)
    );

    document.getElementById("saved").textContent =
        "Zapisano lokalnie";
}


function readMeta(year){

    try{

        const raw =
            localStorage.getItem(metaKey(year));

        if(!raw){
            return {};
        }

        const m = JSON.parse(raw);

        return m && typeof m === "object"
            ? m
            : {};

    }catch(e){

        return {};

    }
}


function writeMeta(year,m){

    localStorage.setItem(
        metaKey(year),
        JSON.stringify(m)
    );
}


/* =========================================================
   CZAS ZMIANY
========================================================= */

function nowISO(){
    return new Date().toISOString();
}


/* =========================================================
   ZAPIS POJEDYNCZEGO DNIA
========================================================= */

function saveDay(year,date,value){

    const d = readYear(year);
    const meta = readMeta(year);

    d[date] = value;

    /*
       Każda lokalna zmiana dostaje własny timestamp.
       Dzięki temu możemy później porównać ją
       z wersją znajdującą się w Supabase.
    */

    meta[date] = nowISO();

    writeYear(year,d);
    writeMeta(year,meta);

    renderSummary();

    scheduleSync();

}


/* =========================================================
   USUNIĘCIE / WYCZYSZCZENIE DNIA
========================================================= */

function clearDay(year,date){

    const d = readYear(year);
    const meta = readMeta(year);

    delete d[date];

    /*
       Brak rekordu lokalnie traktujemy jako pusty dzień.
       Do Supabase wyślemy {} zamiast fizycznego DELETE.
       Dzięki temu nie potrzebujemy tombstone.
    */

    meta[date] = nowISO();

    writeYear(year,d);
    writeMeta(year,meta);

    renderSummary();

    scheduleSync();
}


/* =========================================================
   DOMYŚLNE DANE
========================================================= */

function normalizeDay(value){

    if(!value || typeof value !== "object"){
        return {};
    }

    return {
        from: value.from || "",
        to: value.to || "",
        type: value.type || "",
        project: value.project || "",
        note: value.note || ""
    };
}


/* =========================================================
   AUTOMATYCZNE GODZINY DLA URLOPU
========================================================= */

function adjustByType(day,type){

    if(type === "Urlop"){

        day.from = "07:00";
        day.to   = "15:00";

    }

    if(
        type === "Święto" ||
        type === "Wolne" ||
        type === "L4"
    ){

        day.from = "";
        day.to   = "";

    }

    return day;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const container =
        document.getElementById("months");

    container.innerHTML = "";

    const d = readYear(currentYear);

    for(let month=0; month<12; month++){

        const monthBox =
            document.createElement("div");

        monthBox.className = "month";

        const title =
            document.createElement("div");

        title.className = "monthTitle";

        title.textContent =
            MONTHS[month] + " " + currentYear;

        monthBox.appendChild(title);


        const wrap =
            document.createElement("div");

        wrap.className = "tableWrap";


        const table =
            document.createElement("table");

        table.innerHTML = `
            <thead>
                <tr>
                    <th>✓</th>
                    <th>Data</th>
                    <th>Dzień</th>
                    <th>Od</th>
                    <th>Do</th>
                    <th>Rodzaj</th>
                    <th>Projekt</th>
                    <th>Uwagi</th>
                </tr>
            </thead>
        `;


        const tbody =
            document.createElement("tbody");


        const days =
            new Date(
                currentYear,
                month + 1,
                0
            ).getDate();


        for(let day=1; day<=days; day++){

            const date =
                `${currentYear}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

            const jsDate =
                new Date(
                    currentYear,
                    month,
                    day
                );

            const weekday =
                jsDate.getDay();

            const weekdayNames = [
                "Nd",
                "Pn",
                "Wt",
                "Śr",
                "Cz",
                "Pt",
                "Sb"
            ];

            const old =
                normalizeDay(d[date]);


            const tr =
                document.createElement("tr");


            if(
                weekday === 0 ||
                weekday === 6
            ){
                tr.classList.add("weekend");
            }


            if(
                date ===
                formatDate(new Date())
            ){
                tr.classList.add("today");
            }


            if(selectedDays.has(date)){
                tr.classList.add("selectedRow");
            }


            const check =
                document.createElement("input");

            check.type = "checkbox";
            check.checked =
                selectedDays.has(date);

            check.addEventListener("change",()=>{

                if(check.checked){
                    selectedDays.add(date);
                }else{
                    selectedDays.delete(date);
                }

                updateSelectedCount();

                tr.classList.toggle(
                    "selectedRow",
                    check.checked
                );

            });


            const tdCheck =
                document.createElement("td");

            tdCheck.appendChild(check);


            const tdDate =
                document.createElement("td");

            tdDate.className = "date";
            tdDate.textContent = date;


            const tdDay =
                document.createElement("td");

            tdDay.className = "day";
            tdDay.textContent =
                weekdayNames[weekday];


            const from =
                document.createElement("input");

            from.type = "time";
            from.value = old.from;


            from.addEventListener("change",()=>{

                const dayData =
                    normalizeDay(
                        readYear(currentYear)[date]
                    );

                dayData.from = from.value;

                saveDay(
                    currentYear,
                    date,
                    dayData
                );

            });


            const tdFrom =
                document.createElement("td");

            tdFrom.appendChild(from);


            const to =
                document.createElement("input");

            to.type = "time";
            to.value = old.to;


            to.addEventListener("change",()=>{

                const dayData =
                    normalizeDay(
                        readYear(currentYear)[date]
                    );

                dayData.to = to.value;

                saveDay(
                    currentYear,
                    date,
                    dayData
                );

            });


            const tdTo =
                document.createElement("td");

            tdTo.appendChild(to);


            const type =
                document.createElement("select");


            TYPES.forEach(t=>{

                const option =
                    document.createElement("option");

                option.value = t;
                option.textContent = t;

                if(t === old.type){
                    option.selected = true;
                }

                type.appendChild(option);

            });


            type.addEventListener("change",()=>{

                const dayData =
                    normalizeDay(
                        readYear(currentYear)[date]
                    );

                dayData.type = type.value;

                adjustByType(
                    dayData,
                    type.value
                );

                saveDay(
                    currentYear,
                    date,
                    dayData
                );

                render();

            });


            const tdType =
                document.createElement("td");

            tdType.appendChild(type);


            const project =
                document.createElement("input");

            project.className = "project";
            project.type = "text";
            project.value = old.project;


            project.addEventListener("change",()=>{

                const dayData =
                    normalizeDay(
                        readYear(currentYear)[date]
                    );

                dayData.project =
                    project.value;

                saveDay(
                    currentYear,
                    date,
                    dayData
                );

            });


            const tdProject =
                document.createElement("td");

            tdProject.appendChild(project);


            const note =
                document.createElement("input");

            note.className = "note";
            note.type = "text";
            note.value = old.note;


            note.addEventListener("change",()=>{

                const dayData =
                    normalizeDay(
                        readYear(currentYear)[date]
                    );

                dayData.note =
                    note.value;

                saveDay(
                    currentYear,
                    date,
                    dayData
                );

            });


            const tdNote =
                document.createElement("td");

            tdNote.appendChild(note);


            tr.appendChild(tdCheck);
            tr.appendChild(tdDate);
            tr.appendChild(tdDay);
            tr.appendChild(tdFrom);
            tr.appendChild(tdTo);
            tr.appendChild(tdType);
            tr.appendChild(tdProject);
            tr.appendChild(tdNote);

            tbody.appendChild(tr);

        }


        table.appendChild(tbody);
        wrap.appendChild(table);
        monthBox.appendChild(wrap);
        container.appendChild(monthBox);

    }


    renderSummary();
    updateSelectedCount();

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(date){

    return date.getFullYear()
        + "-"
        + String(date.getMonth()+1).padStart(2,"0")
        + "-"
        + String(date.getDate()).padStart(2,"0");

}


/* =========================================================
   PODSUMOWANIE
========================================================= */

function timeToMinutes(value){

    if(!value){
        return 0;
    }

    const parts =
        value.split(":");

    if(parts.length !== 2){
        return 0;
    }

    return (
        Number(parts[0]) * 60
        +
        Number(parts[1])
    );

}


function minutesToTime(minutes){

    const h =
        Math.floor(minutes / 60);

    const m =
        minutes % 60;

    return (
        h
        + ":"
        + String(m).padStart(2,"0")
    );

}


function renderSummary(){

    const d =
        readYear(currentYear);

    const sums = {
        Praca:0,
        Delegacja:0,
        Urlop:0,
        L4:0,
        Święto:0,
        Wolne:0
    };

    Object.values(d).forEach(day=>{

        if(!day || !day.type){
            return;
        }

        let minutes = 0;

        if(day.from && day.to){

            minutes =
                timeToMinutes(day.to)
                -
                timeToMinutes(day.from);

            if(minutes < 0){
                minutes = 0;
            }

        }

        if(
            Object.prototype.hasOwnProperty.call(
                sums,
                day.type
            )
        ){
            sums[day.type] += minutes;
        }

    });


    document.getElementById("sumWork")
        .textContent =
        minutesToTime(sums.Praca);

    document.getElementById("sumTrip")
        .textContent =
        minutesToTime(sums.Delegacja);

    document.getElementById("sumVacation")
        .textContent =
        minutesToTime(sums.Urlop);

    document.getElementById("sumSick")
        .textContent =
        minutesToTime(sums.L4);

    document.getElementById("sumHoliday")
        .textContent =
        minutesToTime(sums.Święto);

    document.getElementById("sumFree")
        .textContent =
        minutesToTime(sums.Wolne);

    const total =
        Object.values(sums)
            .reduce((a,b)=>a+b,0);

    document.getElementById("sumTotal")
        .textContent =
        minutesToTime(total);

}


/* =========================================================
   DZIŚ
========================================================= */

function goToday(){

    const today =
        new Date();

    const year =
        today.getFullYear();

    if(
        year >= FIRST_YEAR &&
        year <= LAST_YEAR
    ){

        currentYear = year;
        ys.value = year;

    }

    render();

    setTimeout(()=>{

/* =========================================================
   ZAZNACZANIE / BULK
========================================================= */

function updateSelectedCount(){

    document.getElementById("selectedCount")
        .textContent =
        selectedDays.size;

}


function showBulkPanel(){

    document.getElementById("bulkPanel")
        .style.display = "flex";

    updateSelectedCount();

}


function hideBulkPanel(){

    document.getElementById("bulkPanel")
        .style.display = "none";

}


function applyBulk(){

    if(selectedDays.size === 0){

        showMessage(
            "Nie zaznaczono żadnego dnia."
        );

        return;

    }


    const from =
        document.getElementById("bulkFrom").value;

    const to =
        document.getElementById("bulkTo").value;

    const type =
        document.getElementById("bulkType").value;

    const project =
        document.getElementById("bulkProject").value;


    const d =
        readYear(currentYear);

    const meta =
        readMeta(currentYear);

    const timestamp =
        nowISO();


    selectedDays.forEach(date=>{

        const old =
            normalizeDay(d[date]);

        old.from = from;
        old.to = to;
        old.type = type;
        old.project = project;

        adjustByType(old,type);

        d[date] = old;
        meta[date] = timestamp;

    });


    writeYear(currentYear,d);
    writeMeta(currentYear,meta);

    selectedDays.clear();

    render();

    hideBulkPanel();

    scheduleSync();

}


/* =========================================================
   CZYSZCZENIE ZAZNACZONYCH
========================================================= */

function clearSelected(){

    if(selectedDays.size === 0){

        showMessage(
            "Nie zaznaczono żadnego dnia."
        );

        return;

    }


    if(
        !confirm(
            "Czy na pewno wyczyścić zaznaczone dni?"
        )
    ){
        return;
    }


    const d =
        readYear(currentYear);

    const meta =
        readMeta(currentYear);

    const timestamp =
        nowISO();


    selectedDays.forEach(date=>{

        delete d[date];

        meta[date] =
            timestamp;

    });


    writeYear(currentYear,d);
    writeMeta(currentYear,meta);

    selectedDays.clear();

    render();

    scheduleSync();

}


/* =========================================================
   BACKUP
========================================================= */

function backupData(){

    const backup = {
        version:2,
        createdAt:new Date().toISOString(),
        years:{},
        meta:{},
        settings:{
            lastFrom:
                localStorage.getItem(
                    "worktime_last_from"
                ) || "07:00",

            lastTo:
                localStorage.getItem(
                    "worktime_last_to"
                ) || "15:00",

            lastType:
                localStorage.getItem(
                    "worktime_last_type"
                ) || "Praca"
        }
    };


    YEARS.forEach(year=>{

        backup.years[year] =
            readYear(year);

        backup.meta[year] =
            readMeta(year);

    });


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "ewidencja_czasu_pracy_backup_"
        +
        new Date()
            .toISOString()
            .slice(0,10)
        +
        ".json";


    a.click();

    URL.revokeObjectURL(url);

}


/* =========================================================
   RESTORE
========================================================= */

function restoreData(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload = ()=>{

        try{

            const backup =
                JSON.parse(
                    reader.result
                );


            if(
                !backup.years ||
                typeof backup.years !== "object"
            ){

                throw new Error(
                    "Nieprawidłowy plik backupu."
                );

            }


            if(
                !confirm(
                    "Przywrócić dane z backupu? Aktualne lokalne dane zostaną zastąpione."
                )
            ){
                return;
            }


            YEARS.forEach(year=>{

                const d =
                    backup.years[year] || {};

                localStorage.setItem(
                    dataKey(year),
                    JSON.stringify(d)
                );


                /*
                   Jeżeli backup nie ma timestampów,
                   nadajemy wszystkim przywróconym
                   rekordom aktualny czas.
                */

                const oldMeta =
                    backup.meta &&
                    backup.meta[year]
                        ? backup.meta[year]
                        : {};

                const meta = {};

                Object.keys(d).forEach(date=>{

                    meta[date] =
                        oldMeta[date] ||
                        nowISO();

                });


                localStorage.setItem(
                    metaKey(year),
                    JSON.stringify(meta)
                );

            });


            if(backup.settings){

                if(
                    backup.settings.lastFrom
                ){
                    localStorage.setItem(
                        "worktime_last_from",
                        backup.settings.lastFrom
                    );
                }

                if(
                    backup.settings.lastTo
                ){
                    localStorage.setItem(
                        "worktime_last_to",
                        backup.settings.lastTo
                    );
                }

                if(
                    backup.settings.lastType
                ){
                    localStorage.setItem(
                        "worktime_last_type",
                        backup.settings.lastType
                    );
                }

            }


            render();

            showMessage(
                "Backup przywrócony lokalnie."
            );

            scheduleSync();


        }catch(e){

            console.error(e);

            alert(
                "Nie udało się przywrócić backupu:\n"
                +
                e.message
            );

        }

    };


    reader.readAsText(file);

    event.target.value = "";

}


/* =========================================================
   EXCEL
========================================================= */

async function exportExcel(){

    const workbook =
        new ExcelJS.Workbook();


    for(let month=0; month<12; month++){

        const monthName =
            MONTHS[month];

        const sheet =
            workbook.addWorksheet(
                monthName
            );


        sheet.columns = [
            {
                header:"Data",
                key:"date",
                width:14
            },
            {
                header:"Dzień",
                key:"day",
                width:10
            },
            {
                header:"Od",
                key:"from",
                width:10
            },
            {
                header:"Do",
                key:"to",
                width:10
            },
            {
                header:"Rodzaj",
                key:"type",
                width:15
            },
            {
                header:"Projekt",
                key:"project",
                width:25
            },
            {
                header:"Uwagi",
                key:"note",
                width:40
            }
        ];


        const d =
            readYear(currentYear);


        const days =
            new Date(
                currentYear,
                month+1,
                0
            ).getDate();


        for(let day=1; day<=days; day++){

            const date =
                `${currentYear}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

            const jsDate =
                new Date(
                    currentYear,
                    month,
                    day
                );


            const weekdays = [
                "Nd",
                "Pn",
                "Wt",
                "Śr",
                "Cz",
                "Pt",
                "Sb"
            ];


            const item =
                normalizeDay(d[date]);


            sheet.addRow({
                date:date,
                day:weekdays[jsDate.getDay()],
                from:item.from,
                to:item.to,
                type:item.type,
                project:item.project,
                note:item.note
            });

        }


        sheet.getRow(1).font = {
            bold:true
        };

    }


    const summary =
        workbook.addWorksheet(
            "Podsumowanie roku"
        );


    summary.addRow([
        "Rok",
        currentYear
    ]);

    summary.addRow([]);

    summary.addRow([
        "Rodzaj",
        "Czas"
    ]);


    const d =
        readYear(currentYear);


    const sums = {
        Praca:0,
        Delegacja:0,
        Urlop:0,
        L4:0,
        Święto:0,
        Wolne:0
    };


    Object.values(d).forEach(day=>{

        if(!day || !day.type){
            return;
        }

        let min = 0;

        if(day.from && day.to){

            min =
                timeToMinutes(day.to)
                -
                timeToMinutes(day.from);

            if(min < 0){
                min = 0;
            }

        }

        if(
            Object.prototype.hasOwnProperty.call(
                sums,
                day.type
            )
        ){
            sums[day.type] += min;
        }

    });


    Object.keys(sums).forEach(type=>{

        summary.addRow([
            type,
            minutesToTime(sums[type])
        ]);

    });


    summary.getRow(1).font = {
        bold:true
    };

    summary.getRow(3).font = {
        bold:true
    };


    const buffer =
        await workbook.xlsx.writeBuffer();


    const blob =
        new Blob(
            [buffer],
            {
                type:
                "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "ewidencja_czasu_pracy_"
        +
        currentYear
        +
        ".xlsx";

    a.click();

    URL.revokeObjectURL(url);

}

async function login(){

    const email =

            "authEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "authPassword"
        ).value;


    if(!email || !password){

        setAuthMessage(

            true
        );

        return;

    }


    setAuthMessage(
        "Logowanie..."
    );


    const {data,error} =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if(error){

        console.error(error);

        setAuthMessage(
            error.message,
            true
        );

        return;

    }


    currentUser =
        data.user;

    await startApplication();

}


async function registerUser(){

    const email =
        document.getElementById(
            "authEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "authPassword"
        ).value;


    if(!email || !password){

        setAuthMessage(
            "Podaj e-mail i hasło.",

        );

        return;

    }


    if(password.length < 6){

        setAuthMessage(
            "Hasło musi mieć co najmniej 6 znaków.",
            true
        );

        return;

    }


    setAuthMessage(
        "Tworzenie konta..."
    );


    const {data,error} =
        await supabaseClient.auth.signUp({
            email,
            password
        });


    if(error){

        console.error(error);

        setAuthMessage(
            error.message,
            true
        );

        return;

    }


    if(data.session){

        currentUser =
            data.user;

        await startApplication();

    }else{

        setAuthMessage(
            "Konto utworzone. Sprawdź e-mail i potwierdź konto."
        );

    }

}

async function startApplication(){

    }


    document.getElementById("authScreen")
        .style.display = "none";

    document.getElementById("app")
        .style.display = "block";


    document.getElementById("userInfo")

       Potem robimy ją cyklicznie.

}


/* =========================================================
   POBRANIE DANYCH Z SUPABASE
========================================================= */

async function fetchRemote(){

    if(!currentUser){
        return null;
    }


    const {data,error} =
        await supabase
            .from("worktime_entries")
            .select(
                "entry_date,data,modified_at"
            )
            .eq(
                "user_id",
                currentUser.id
            );


    if(error){

        console.error(
            "Supabase fetch error:",
            error
        );

        throw error;

    }


    return data || [];

}


/* =========================================================
   SYNCHRONIZACJA JEDNEGO DNIA
========================================================= */

async function pushDay(
    year,
    date,
    localData,
    modifiedAt
){

    if(!currentUser){
        return;
    }


    const {data,error} =
        await supabaseClient.rpc(
            "sync_worktime_entry",
            {
                p_entry_date:date,
                p_data:localData || {},
                p_modified_at:modifiedAt
            }
        );


    if(error){

        console.error(
            "RPC sync error:",
            error
        );

        throw error;

    }


    return data;

}


/* =========================================================
   SYNCHRONIZACJA WSZYSTKICH DANYCH
========================================================= */

async function syncAll(manual=false){

    if(
        !currentUser ||
        syncRunning
    ){
        return;
    }


    if(
        !navigator.onLine
    ){

        setSyncStatus(
            "⚫ Offline"
        );

        return;

    }


    syncRunning = true;


    try{

        if(manual){

            setSyncStatus(
                "🔄 Synchronizacja..."
            );

        }


        const remote =
            await fetchRemote();


        /*
           Mapujemy dane z serwera:
           YYYY-MM-DD -> rekord
        */

        const remoteMap = new Map();

        remote.forEach(row=>{

            remoteMap.set(
                row.entry_date,
                row
            );

        });


        /*
           Najpierw przetwarzamy wszystkie lata,
           które mamy lokalnie.
        */

        for(const year of YEARS){

            const local =
                readYear(year);

            const meta =
                readMeta(year);


            /*
               Znajdźmy lokalne daty.
            */

            const localDates =
                new Set([
                    ...Object.keys(local),
                    ...Object.keys(meta)
                ]);


            /*
               Obsługujemy lokalne rekordy.
            */

            for(const date of localDates){

                const localValue =
                    local[date] || {};

                let localModified =
                    meta[date];


                /*
                   Stary localStorage może nie mieć
                   timestampów.

                   Jeżeli rekord istnieje tylko lokalnie,
                   traktujemy go jako nowy.
                */

                if(!localModified){

                    if(remoteMap.has(date)){

                        /*
                           Serwer ma dane,
                           a lokalne nie ma timestampu.
                           Przy pierwszym połączeniu
                           bezpieczniej przyjąć wersję
                           z serwera.
                        */

                        continue;

                    }else{

                        localModified =
                            nowISO();

                        meta[date] =
                            localModified;

                        writeMeta(
                            year,
                            meta
                        );

                    }

                }


                const remoteRow =
                    remoteMap.get(date);


                if(!remoteRow){

                    /*
                       Nie ma w Supabase.
                       Wysyłamy lokalną wersję.
                    */

                    await pushDay(
                        year,
                        date,
                        localValue,
                        localModified
                    );

                    continue;

                }


                const remoteModified =
                    remoteRow.modified_at;


                if(
                    new Date(localModified)
                    >
                    new Date(remoteModified)
                ){

                    /*
                       LOCAL jest nowszy.
                    */

                    await pushDay(
                        year,
                        date,
                        localValue,
                        localModified
                    );

                }else if(
                    new Date(remoteModified)
                    >
                    new Date(localModified)
                ){

                    /*
                       SUPABASE jest nowszy.
                    */

                    if(
                        remoteRow.data &&
                        Object.keys(
                            remoteRow.data
                        ).length > 0
                    ){

                        local[date] =
                            remoteRow.data;

                    }else{

                        delete local[date];

                    }


                    meta[date] =
                        remoteModified;


                    writeYear(
                        year,
                        local
                    );

                    writeMeta(
                        year,
                        meta
                    );

                }

            }

        }


        /*
           Teraz sprawdzamy rekordy istniejące
           w Supabase, których lokalnie nie ma.
        */

        for(const row of remote){

            const date =
                row.entry_date;

            const year =
                Number(
                    date.slice(0,4)
                );


            if(
                year < FIRST_YEAR ||
                year > LAST_YEAR
            ){
                continue;
            }


            const local =
                readYear(year);

            const meta =
                readMeta(year);


            if(
                !Object.prototype.hasOwnProperty.call(
                    meta,
                    date
                )
            ){

                /*
                   Brak lokalnego timestampu.
                   Jeżeli brak lokalnego rekordu,
                   pobieramy wersję serwerową.
                */

                if(
                    !Object.prototype.hasOwnProperty.call(
                        local,
                        date
                    )
                ){

                    if(
                        row.data &&
                        Object.keys(row.data).length
                    ){

                        local[date] =
                            row.data;

                    }

                }


                meta[date] =
                    row.modified_at;


                writeYear(
                    year,
                    local
                );

                writeMeta(
                    year,
                    meta
                );

            }

        }


        render();


        setSyncStatus(
            "🟢 Zsynchronizowano " +
            new Date().toLocaleTimeString()
        );


        document.getElementById("saved")
            .textContent =
            "Zapisano i zsynchronizowano";


    }catch(error){

        console.error(
            "SYNC ERROR:",
            error
        );


        setSyncStatus(
            "🟠 Błąd synchronizacji"
        );


        if(manual){

            showMessage(
                "Błąd synchronizacji: "
                +
                error.message
            );

        }

    }finally{

        syncRunning = false;

    }

}


/* =========================================================
   AUTOMATYCZNA SYNCHRONIZACJA
========================================================= */

let syncTimer = null;


function scheduleSync(){

    if(syncTimer){
        return;
    }


    syncTimer =
        setTimeout(
            async()=>{

                syncTimer = null;

                await syncAll(false);

            },
            1200
        );

}
