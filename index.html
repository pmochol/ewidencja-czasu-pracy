<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ewidencja czasu pracy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<style>
:root {
    --topbar-height: 58px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* =========================================================
   GÓRNA BELKA
   ========================================================= */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    z-index: 2000;

    min-height: 58px;

    display: flex;
    align-items: center;
    gap: 6px;

    padding: 8px 10px;

    background: #222;
    color: white;

    box-shadow: 0 2px 6px rgba(0,0,0,.25);

    /*
       Ważne:
       belka może być przewijana poziomo na telefonie.
    */
    overflow-x: auto;
    overflow-y: visible;

    scrollbar-width: thin;
}

.topbar::-webkit-scrollbar {
    height: 5px;
}

.topbar::-webkit-scrollbar-thumb {
    background: #777;
    border-radius: 5px;
}

.topbar button,
.topbar select {
    height: 36px;

    flex: 0 0 auto;

    border: 1px solid #666;
    border-radius: 5px;

    background: #333;
    color: white;

    padding: 0 10px;

    cursor: pointer;

    font-size: 13px;
}

.topbar button:hover,
.topbar select:hover {
    background: #444;
}

.topbar select {
    min-width: 62px;
    width: 62px;
}

.topbar-title {
    font-weight: bold;
    margin-right: 5px;
    white-space: nowrap;
    flex: 0 0 auto;
}

.spacer {
    flex: 1 0 20px;
    min-width: 20px;
}

/* =========================================================
   STATUS SYNCHRONIZACJI
   ========================================================= */

#syncStatus {
    white-space: nowrap;

    font-size: 12px;
    color: #ccc;

    padding: 0 5px;

    flex: 0 0 auto;
}

.sync-ok {
    color: #81c784 !important;
}

.sync-offline {
    color: #ffcc80 !important;
}

.sync-error {
    color: #ef9a9a !important;
}

/* =========================================================
   INFORMACJA O ZAZNACZENIU
   ========================================================= */

#selectedInfo {
    white-space: nowrap;
    font-size: 12px;
    color: #ddd;
    flex: 0 0 auto;
}

/* =========================================================
   MENU "WIĘCEJ"
   ========================================================= */

.moreMenu {
    position: static;
    display: none;

    flex: 0 0 auto;
}

.moreButton {
    white-space: nowrap;
}

/*
   Menu jest fixed względem ekranu.
   Dzięki temu nie jest obcinane przez poziomy scroll belki.
*/
.moreDropdown {
    display: none;

    position: fixed;

    right: 8px;
    top: calc(var(--topbar-height) + 5px);

    width: 190px;

    padding: 5px;

    background: #333;

    border: 1px solid #666;
    border-radius: 6px;

    box-shadow: 0 5px 15px rgba(0,0,0,.3);

    z-index: 5000;
}

.moreDropdown.show {
    display: block;
}

.moreDropdown button {
    display: block;

    width: 100%;

    height: 38px;

    margin: 2px 0;

    text-align: left;

    background: #333;
    border: 0;
}

.moreDropdown button:hover {
    background: #444;
}

/* =========================================================
   GŁÓWNA ZAWARTOŚĆ
   ========================================================= */

#application {
    padding-top: var(--topbar-height);
}

#app {
    width: 100%;
}

/* =========================================================
   PODSUMOWANIE ROCZNE
   ========================================================= */

.yearSummary {
    display: flex;
    flex-wrap: wrap;

    gap: 5px;

    padding: 7px 8px;

    background: white;

    border-bottom: 1px solid #ccc;

    box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

.summaryTitle {
    width: 100%;

    font-size: 14px;
    font-weight: bold;

    padding: 2px 3px 4px;
}

.summaryCard {
    min-width: 85px;

    flex: 1 1 85px;

    padding: 4px 7px;

    text-align: center;

    border: 1px solid #ddd;
    border-radius: 5px;

    background: #fafafa;

    line-height: 1.15;
}

.summaryLabel {
    display: block;

    font-size: 10px;

    color: #666;
}

.summaryValue {
    display: block;

    font-size: 15px;
    font-weight: bold;
}

.summarySaved {
    display: flex;

    align-items: center;
    justify-content: center;

    min-width: 150px;

    padding: 4px 8px;

    font-size: 11px;

    color: #555;
}

/* =========================================================
   MIESIĄC
   ========================================================= */

.monthContainer {
    margin: 12px 8px 20px;

    background: white;

    border: 1px solid #ccc;
    border-radius: 6px;

    overflow: visible;
}

.monthTitle {
    padding: 8px 10px;

    background: #333;
    color: white;

    font-size: 16px;
    font-weight: bold;

    border-radius: 5px 5px 0 0;
}

/* =========================================================
   PODSUMOWANIE MIESIĘCZNE
   ========================================================= */

.monthSummary {
    position: sticky;

    top: var(--topbar-height);

    z-index: 1000;

    display: flex;
    flex-wrap: wrap;

    gap: 4px;

    padding: 5px;

    background: white;

    border-bottom: 1px solid #ccc;

    box-shadow: 0 2px 5px rgba(0,0,0,.12);
}

.monthSummaryTitle {
    display: flex;
    align-items: center;

    padding: 3px 7px;

    font-size: 12px;
    font-weight: bold;

    white-space: nowrap;
}

.monthSummaryCard {
    min-width: 65px;

    flex: 1 1 65px;

    padding: 3px 5px;

    text-align: center;

    border: 1px solid #ddd;
    border-radius: 4px;

    background: #fafafa;

    line-height: 1.1;
}

.monthSummaryLabel {
    display: block;

    font-size: 9px;

    color: #666;
}

.monthSummaryValue {
    display: block;

    font-size: 13px;

    font-weight: bold;
}

/* =========================================================
   TABELA
   ========================================================= */

.tableWrapper {
    width: 100%;

    overflow-x: auto;
}

table {
    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;
}

th,
td {
    border: 1px solid #ddd;

    padding: 4px 5px;

    font-size: 13px;
}

/*
   UWAGA:
   Nagłówek tabeli NIE jest sticky.
*/
th {
    background: #e8e8e8;

    font-weight: bold;
    text-align: center;
}

td {
    background: white;
}

td.center {
    text-align: center;
}

/* szerokości kolumn */

th:nth-child(1),
td:nth-child(1) {
    width: 38px;
}

th:nth-child(2),
td:nth-child(2) {
    width: 90px;
}

th:nth-child(3),
td:nth-child(3) {
    width: 75px;
}

th:nth-child(4),
td:nth-child(4) {
    width: 70px;
}

th:nth-child(5),
td:nth-child(5) {
    width: 70px;
}

th:nth-child(6),
td:nth-child(6) {
    width: 110px;
}

th:nth-child(7),
td:nth-child(7) {
    width: 170px;
}

th:nth-child(8),
td:nth-child(8) {
    width: auto;
}

/* =========================================================
   INPUTY
   ========================================================= */

input[type="time"],
input[type="text"],
select {
    width: 100%;
    height: 30px;

    border: 1px solid #ccc;
    border-radius: 4px;

    padding: 3px 5px;

    font-size: 13px;
}

input[type="checkbox"] {
    width: 17px;
    height: 17px;
}

/* =========================================================
   DZISIAJ
   ========================================================= */

.today {
    outline: 3px solid #2196f3;
    outline-offset: -3px;
}

.today td {
    background: #eaf4ff;
}

/* =========================================================
   URLOP
   ========================================================= */

.vacationDay td {
    background: #fff3cd !important;
}

.selectedRow td {
    background: #eef5ff !important;
}

.selectedRow.vacationDay td {
    background: #fff3cd !important;
}

/* =========================================================
   LOGOWANIE
   ========================================================= */

#loginScreen {
    position: fixed;
    inset: 0;

    z-index: 5000;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #f5f5f5;
}

.loginBox {
    width: min(380px, calc(100% - 30px));

    padding: 25px;

    background: white;

    border: 1px solid #ccc;
    border-radius: 8px;

    box-shadow: 0 4px 20px rgba(0,0,0,.15);
}

.loginBox h2 {
    margin-top: 0;

    text-align: center;
}

.loginBox input {
    width: 100%;
    height: 40px;

    margin-bottom: 10px;

    padding: 8px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

.loginBox button {
    width: 100%;
    height: 40px;

    margin-top: 5px;

    border: 0;
    border-radius: 5px;

    background: #1976d2;
    color: white;

    cursor: pointer;
}

.loginBox button:hover {
    background: #1565c0;
}

.loginMessage {
    min-height: 20px;

    margin-top: 10px;

    text-align: center;

    color: #c00;

    font-size: 13px;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 4000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.45);
}

.modalBox {
    width: min(500px, calc(100% - 30px));

    max-height: 90vh;

    overflow: auto;

    padding: 20px;

    background: white;

    border-radius: 8px;
}

.modalBox h3 {
    margin-top: 0;
}

.modalButtons {
    display: flex;

    gap: 8px;

    justify-content: flex-end;

    margin-top: 15px;
}

.modalButtons button {
    padding: 8px 14px;

    border: 1px solid #bbb;
    border-radius: 5px;

    background: #eee;

    cursor: pointer;
}

/* =========================================================
   PRZYCISKI
   ========================================================= */

.danger {
    background: #b71c1c !important;
}

.success {
    background: #2e7d32 !important;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .topbar {
        min-height: 0;

        flex-wrap: nowrap;

        padding: 6px;

        gap: 5px;

        /*
           Pozwalamy przewijać całą belkę poziomo.
        */
        overflow-x: auto;
        overflow-y: hidden;
    }

    .topbar-title {
        display: none;
    }

    /*
       Spacer na telefonie nie może rozpychać belki.
    */
    .spacer {
        flex: 0 0 5px;
        min-width: 5px;
    }

    .topbar button,
    .topbar select {
        height: 34px;

        padding: 0 7px;

        font-size: 12px;
    }

    /*
       Rok ma być mały.
    */
    #yearSelect {
        min-width: 58px;
        width: 58px;
    }

    /*
       Najważniejsze przyciski zostają na belce.
    */
    #todayButton,
    #selectAllButton,
    #bulkButton,
    #syncButton {
        display: inline-block;
    }

    /*
       Mniej ważne przyciski są w Więcej.
    */
    .desktopOnly {
        display: none !important;
    }

    .moreMenu {
        display: block;
    }

    #selectedInfo {
        font-size: 10px;
        padding: 0 3px;
    }

    #syncStatus {
        max-width: 115px;

        overflow: hidden;

        text-overflow: ellipsis;

        font-size: 10px;
    }

    .yearSummary {
        padding: 5px;
    }

    .summaryCard {
        min-width: 65px;

        flex: 1 1 65px;

        padding: 3px 4px;
    }

    .summaryLabel {
        font-size: 9px;
    }

    .summaryValue {
        font-size: 13px;
    }

    .summarySaved {
        min-width: 100px;

        font-size: 9px;
    }

    .monthContainer {
        margin-left: 4px;
        margin-right: 4px;
    }

    .monthTitle {
        font-size: 14px;
    }

    .monthSummary {
        gap: 2px;

        padding: 4px;
    }

    .monthSummaryTitle {
        width: 100%;

        padding: 2px 4px;
    }

    .monthSummaryCard {
        min-width: 55px;

        flex: 1 1 55px;

        padding: 2px 3px;
    }

    .monthSummaryLabel {
        font-size: 8px;
    }

    .monthSummaryValue {
        font-size: 11px;
    }

    th,
    td {
        font-size: 12px;
    }

    th:nth-child(2),
    td:nth-child(2) {
        width: 80px;
    }

    th:nth-child(3),
    td:nth-child(3) {
        width: 60px;
    }

    th:nth-child(4),
    td:nth-child(4),
    th:nth-child(5),
    td:nth-child(5) {
        width: 65px;
    }

    th:nth-child(6),
    td:nth-child(6) {
        width: 95px;
    }

    th:nth-child(7),
    td:nth-child(7) {
        width: 140px;
    }

    th:nth-child(8),
    td:nth-child(8) {
        width: 180px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     LOGIN
     ========================================================= -->

<div id="loginScreen">

    <div class="loginBox">

        <h2>Ewidencja czasu pracy</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="E-mail"

        <input
            id="loginPassword"
            type="password"
            placeholder="Hasło"
            autocomplete="current-password"
        >

        <button onclick="login()">

        </button>

        <button onclick="registerUser()">
            Rejestracja
        </button>

        <div id="loginMessage" class="loginMessage"></div>

    </div>

</div>


<!-- =========================================================
     APLIKACJA
     ========================================================= -->

<div id="application">

    <div class="topbar" id="topbar">

        <span class="topbar-title">
            Ewidencja czasu pracy
        </span>

        <button
            id="todayButton"

        >
            📅 Dzisiaj
        </button>

        <select
            id="yearSelect"
            onchange="changeYear(this.value)"
        ></select>

        <button
            id="selectAllButton"
            onclick="toggleSelectAll()"
        >
            Zaznacz
        </button>

        <button

            Ustaw dla zaznaczonych
        </button>

            onclick="manualSync()"
        >
            🔄 Synchronizuj
        </button>

        <!-- DESKTOP -->

            class="desktopOnly"
            onclick="clearSelected()"
        >
            🧹 Wyczyść
        </button>

        <button
            class="desktopOnly"
            onclick="backupData()"
        >
            💾 Backup
        </button>

        <button
            class="desktopOnly"
            onclick="restoreData()"
        >
            📂 Przywróć
        </button>

        <button
            class="desktopOnly"
            onclick="exportExcel()"
        >
            📊 Excel
        </button>

        <div class="spacer"></div>

        <span
            id="selectedInfo"
        >
            Zaznaczono: 0

        <span id="syncStatus">

        <button
            class="desktopOnly"

            🚪 Wyloguj

        <!-- MOBILE MENU -->

            >

                    📊 Excel

                <button onclick="logout(); closeMoreMenu();">

        </div>

    </div>


    <!-- =====================================================

    <div

    >

        <div class="summaryTitle">
            Podsumowanie roku
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">
                Przepracowane

            <span
                class="summaryValue"
                id="sumWork"
            >
                0:00
            </span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">
                Delegacja
            </span>

            <span
                class="summaryValue"
                id="sumDelegation"
            >
                0
            </span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">
                Urlop
            </span>

            <span
                class="summaryValue"
                id="sumVacation"
            >
                0
            </span>
        </div>

        <div class="summaryCard">
            <span class="summaryLabel">
                L4
            </span>

            <span
                class="summaryValue"
                id="sumSick"
            >
                0

        </div>

        <div class="summaryCard">
            <span class="summaryLabel">
                Święto
            </span>

        <div class="summaryCard">
            <span class="summaryLabel">

<!-- =========================================================
     MODAL
     ========================================================= -->

<div
    class="modal"
    id="editModal"
>

    <div class="modalBox">

        <h3>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://iazvoxejpizdaithkqof.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Scpe8NZ9lOyH4asc53h9wQ_1S-fWToe";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   USTAWIENIA
   ========================================================= */

const MIN_YEAR = 2024;
const MAX_YEAR = 2035;

const monthNames = [
    "Styczeń",
    "Luty",
    "Marzec",
    "Kwiecień",
    "Maj",
    "Czerwiec",
    "Lipiec",
    "Sierpień",
    "Wrzesień",
    "Październik",
    "Listopad",
    "Grudzień"
];

const dayNames = [
    "Niedziela",
    "Poniedziałek",
    "Wtorek",
    "Środa",
    "Czwartek",
    "Piątek",
    "Sobota"
];

const types = [
    "Praca",
    "Delegacja",
    "Urlop",
    "L4",
    "Święto",
    "Wolne"
];

let currentYear =
    new Date().getFullYear();

let selectedDates =
    new Set();

let syncing = false;

let syncTimer = null;


/* =========================================================
   BELKA - DYNAMICZNA WYSOKOŚĆ
   ========================================================= */

function updateTopLayout() {

    const topbar =
        document.getElementById("topbar");

    if (!topbar) {
        return;
    }

    const height =
        topbar.offsetHeight;

    document.documentElement.style.setProperty(
        "--topbar-height",
        height + "px"
    );
}

window.addEventListener(
    "resize",
    updateTopLayout
);


/* =========================================================
   MENU MOBILE
   ========================================================= */

function toggleMoreMenu(event) {

    if (event) {
        event.stopPropagation();
    }

    const menu =
        document.getElementById(
            "moreDropdown"
        );

    if (!menu) {
        return;
    }

    menu.classList.toggle("show");
}


function closeMoreMenu() {

    const menu =
        document.getElementById(
            "moreDropdown"
        );

    if (menu) {
        menu.classList.remove("show");
    }
}


document.addEventListener(
    "click",
    event => {

        const menu =
            document.querySelector(
                ".moreMenu"
            );

        const dropdown =
            document.getElementById(
                "moreDropdown"
            );

        if (
            menu &&
            dropdown &&
            !menu.contains(event.target) &&
            !dropdown.contains(event.target)
        ) {

            closeMoreMenu();
        }
    }
);


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const email =
        document.getElementById(
            "loginEmail"

/* =========================================================
   STORAGE
   ========================================================= */

function getStorageKey(year) {

    return `worktime_${year}`;
}


function getMetaKey(year) {

    return `worktime_meta_${year}`;
}


function loadYear(year) {

    try {

        const raw =
            localStorage.getItem(
                getStorageKey(year)
            );

        if (!raw) {
            return {};
        }

        return JSON.parse(raw);

    } catch (e) {

        console.error(e);

        return {};
    }
}


function saveYear(year, data) {

    localStorage.setItem(
        getStorageKey(year),
        JSON.stringify(data)
    );
}


function loadMeta(year) {

    try {

        const raw =
            localStorage.getItem(
                getMetaKey(year)
            );

        if (!raw) {
            return {};
        }

        return JSON.parse(raw);

    } catch (e) {

        console.error(e);

        return {};
    }
}


function saveMeta(year, data) {

    localStorage.setItem(
        getMetaKey(year),

    );
}


/* =========================================================
   NORMALIZACJA
   ========================================================= */

function normalizeDay(value) {

    value =
        value || {};

    return {

        from:
            value.from ?? "",

        to:
            value.to ?? "",

        type:
            value.type ?? "",

        project:
            value.project ?? "",

        note:
            value.note ?? ""
    };
}


/* =========================================================
   DATA
   ========================================================= */

function dateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function daysInMonth(year, month) {

    return new Date(
        year,
        month + 1,
        0
    ).getDate();
}


/* =========================================================
   PODSUMOWANIE MIESIĄCA
   ========================================================= */

function calculateMonthSummary(
    data,
    year,
    month
) {

    let workMinutes = 0;

    let delegation = 0;
    let vacation = 0;
    let sick = 0;
    let holiday = 0;
    let free = 0;

    const days =
        daysInMonth(
            year,
            month
        );

    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            new Date(
                year,
                month,
                day
            );

        const key =
            dateKey(date);

        const d =
            normalizeDay(
                data[key]
            );

        if (
            d.from &&
            d.to
        ) {

            const from =
                timeToMinutes(
                    d.from
                );

            const to =
                timeToMinutes(
                    d.to
                );

            if (
                to >= from
            ) {

                workMinutes +=
                    to - from;
            }
        }

        switch (d.type) {

            case "Delegacja":
                delegation++;
                break;

            case "Urlop":
                vacation++;
                break;

            case "L4":
                sick++;
                break;

            case "Święto":
                holiday++;
                break;

            case "Wolne":
                free++;
                break;
        }
    }

    return {

        workMinutes,
        delegation,
        vacation,
        sick,
        holiday,
        free,

        total:
            delegation +
            vacation +
            sick +
            holiday +
            free
    };
}

/* =========================================================
   CZAS
   ========================================================= */

function timeToMinutes(value) {

    if (!value) {
        return 0;
    }

    const parts =
        value.split(":");

    if (
        parts.length !== 2
    ) {
        return 0;
    }

    const h =
        Number(parts[0]);

    const m =
        Number(parts[1]);

    if (
        Number.isNaN(h) ||
        Number.isNaN(m)
    ) {
        return 0;
    }

    return h * 60 + m;
}


function minutesToTime(minutes) {

    const h =
        Math.floor(
            minutes / 60
        );

    const m =
        minutes % 60;

    return `${h}:${String(m).padStart(2, "0")}`;
}

    let allSelected = true;

                );

            if (
                checkbox &&
                !checkbox.checked

            }
        }

    button.textContent =

            ? "Odznacz"

}


/*
   NOWE DZIAŁANIE:

   Zaznacz -> zaznacza wszystkie
   Odznacz -> odznacza wszystkie
*/
function toggleSelectAll() {

    const rows =
        document.querySelectorAll(
            "#app tbody tr"
        );

    if (rows.length === 0) {
        return;
    }


    let allSelected = true;


    rows.forEach(
        tr => {

            const checkbox =
                tr.querySelector(
                    'input[type="checkbox"]'
                );

            if (
                checkbox &&
                !checkbox.checked
            ) {

                allSelected = false;
            }
        }
    );


    /*
       Jeżeli wszystko było zaznaczone,
       teraz wszystko odznaczamy.
    */

    if (allSelected) {

        selectedDates.clear();

    } else {

        /*
           Jeżeli nie wszystko było zaznaczone,
           zaznaczamy wszystkie dni.
        */

        rows.forEach(
            tr => {

                const checkbox =
                    tr.querySelector(
                        'input[type="checkbox"]'
                    );

                if (!checkbox) {
                    return;
                }

                const dateCell =
                    tr.children[1];

                if (!dateCell) {
                    return;
                }

                const key =
                    dateCell.textContent.trim();

                if (key) {
                    selectedDates.add(key);
                }
            }
        );
    }


    /*
       Aktualizacja wszystkich checkboxów
       bez wywoływania eventów change.
    */

    rows.forEach(
        tr => {

            const checkbox =
                tr.querySelector(
                    'input[type="checkbox"]'
                );

            if (!checkbox) {
                return;
            }

            const dateCell =
                tr.children[1];

            if (!dateCell) {
                return;
            }

            const key =
                dateCell.textContent.trim();

            const checked =
                selectedDates.has(key);

            checkbox.checked =
                checked;

            tr.classList.toggle(
                "selectedRow",
                checked
            );
        }
    );


    updateSelectedCount();

    updateSelectAllButton();
}


function clearSelected() {

    selectedDates.clear();

    document
        .querySelectorAll(
            "#app tbody tr"
        )
        .forEach(
            tr => {

                const checkbox =
                    tr.querySelector(
                        'input[type="checkbox"]'
                    );

                if (checkbox) {
                    checkbox.checked =
                        false;
                }

                tr.classList.remove(
                    "selectedRow"
                );
            }
        );

    updateSelectedCount();

    updateSelectAllButton();
}

                    "#app .today"
                );

            if (todayRow) {

                todayRow.scrollIntoView({

                    behavior:
                        "smooth",

                    block:
                        "center"
                });
            }

        },
        100
    );
}


/* =========================================================
   META
   ========================================================= */

function markLocalChange(
    year,
    key
) {

    const meta =
        loadMeta(year);

    meta[key] =
        Date.now();

    saveMeta(
        year,
        meta
    );
}


/* =========================================================
   STATUS SYNCHRONIZACJI
   ========================================================= */

function setSyncPending() {

    const status =
        document.getElementById(
            "syncStatus"
        );

    if (!status) {
        return;
    }

    status.className =
        "sync-offline";

    status.textContent =
        "⏳ Oczekuje na synchronizację";
}


function setSyncSuccess() {

    const status =
        document.getElementById(
            "syncStatus"
        );

    if (!status) {
        return;
    }


    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "pl-PL",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );


    status.className =
        "sync-ok";

    status.textContent =
        `🟢 Zsynchronizowano ${time}`;
}


function setSyncOffline() {

    const status =
        document.getElementById(
            "syncStatus"
        );

    if (!status) {
        return;
    }

    status.className =
        "sync-offline";

    status.textContent =
        "🟠 Offline/local";
}


function setSyncError() {

    const status =
        document.getElementById(
            "syncStatus"
        );

    if (!status) {
        return;
    }

    status.className =
        "sync-error";

    status.textContent =
        "🔴 Błąd synchronizacji";
}


/* =========================================================
   SYNC
   ========================================================= */

function scheduleSync() {

    clearTimeout(
        syncTimer
    );

    syncTimer =
        setTimeout(
            () => {

                syncAll(false);

            },
            1000
        );
}


async function pushDay(
    year,
    key
) {

    const userResult =
        await supabaseClient.auth.getUser();

    const user =
        userResult.data.user;

    if (!user) {
        return;
    }


    const data =
        loadYear(year);

    const day =
        normalizeDay(
            data[key]
        );

    const meta =
        loadMeta(year);


    const localModified =
        meta[key] ||
        Date.now();


    const payload = {

        user_id:
            user.id,

        work_date:
            key,

        year:
            year,

        from_time:
            day.from || null,

        to_time:
            day.to || null,

        work_type:
            day.type || null,

        project:
            day.project || "",

        note:
            day.note || "",

        modified_at:
            new Date(
                localModified
            ).toISOString()
    };


    const { error } =
        await supabaseClient.rpc(
            "sync_worktime_entry",
            payload
        );


    if (error) {

        console.error(
            "Błąd synchronizacji:",
            error
        );

        throw error;
    }
}


async function syncAll(
    showMessage = true
) {

    if (syncing) {
        return;
    }

    syncing = true;


    try {

        const userResult =
            await supabaseClient.auth.getUser();

        const user =
            userResult.data.user;

        if (!user) {
            return;
        }


        if (showMessage) {

            document.getElementById(
                "savedInfo"
            ).textContent =
                "Synchronizacja...";
        }


        const years = [];

        for (
            let year = MIN_YEAR;
            year <= MAX_YEAR;
            year++
        ) {

            years.push(year);
        }


        for (
            const year of years
        ) {

            const {
                data: remoteRows,
                error
            } =
                await supabaseClient
                    .from("worktime_entries")
                    .select("*")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .eq(
                        "year",
                        year
                    );


            if (error) {

                console.error(
                    "Błąd pobierania:",
                    error
                );

                continue;
            }


            const localData =
                loadYear(year);

            const localMeta =
                loadMeta(year);


            const remoteMap = {};


            (remoteRows || []).forEach(
                row => {

                    remoteMap[
                        row.work_date
                    ] = row;
                }
            );


            for (
                const key of Object.keys(
                    localData
                )
            ) {

                const localModified =
                    localMeta[key] || 0;

                const remote =
                    remoteMap[key];


                if (!remote) {

                    try {

                        await pushDay(
                            year,
                            key
                        );

                    } catch (e) {

                        console.error(e);
                    }

                    continue;
                }


                const remoteModified =
                    remote.modified_at
                        ? new Date(
                            remote.modified_at
                          ).getTime()
                        : 0;


                if (
                    localModified >
                    remoteModified
                ) {

                    try {

                        await pushDay(
                            year,
                            key
                        );

                    } catch (e) {

                        console.error(e);
                    }

                } else {

                    localData[key] = {

                        from:
                            remote.from_time || "",

                        to:
                            remote.to_time || "",

                        type:
                            remote.work_type || "",

                        project:
                            remote.project || "",

                        note:
                            remote.note || ""
                    };


                    localMeta[key] =
                        remoteModified;
                }
            }


            for (
                const key of Object.keys(
                    remoteMap
                )
            ) {

                if (
                    localData[key]
                ) {
                    continue;
                }


                const remote =
                    remoteMap[key];


                localData[key] = {

                    from:
                        remote.from_time || "",

                    to:
                        remote.to_time || "",

                    type:
                        remote.work_type || "",

                    project:
                        remote.project || "",

                    note:
                        remote.note || ""
                };


                localMeta[key] =
                    remote.modified_at
                        ? new Date(
                            remote.modified_at
                          ).getTime()
                        : Date.now();
            }


            saveYear(
                year,
                localData
            );

            saveMeta(
                year,
                localMeta
            );
        }


        render();

        setSyncSuccess();


        document.getElementById(
            "savedInfo"
        ).textContent =
            "Dane zapisane i zsynchronizowane";


    } catch (e) {

        console.error(
            "Synchronizacja:",
            e
        );

        setSyncOffline();


        document.getElementById(
            "savedInfo"
        ).textContent =
            "Dane lokalne — oczekują na synchronizację";


    } finally {

        syncing = false;
    }
}


/* =========================================================
   BACKUP
   ========================================================= */

function backupData() {

    const backup = {

        created:
            new Date().toISOString(),

        years: {}
    };


    for (
        let year = MIN_YEAR;
        year <= MAX_YEAR;
        year++
    ) {

        backup.years[year] = {

            data:
                loadYear(year),

            meta:
                loadMeta(year)
        };
    }


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        `ewidencja_czasu_backup_${new Date().toISOString().slice(0,10)}.json`;

    a.click();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   RESTORE
   ========================================================= */

function restoreData() {

    const input =
        document.createElement(
            "input"
        );

    input.type =
        "file";

    input.accept =
        ".json,application/json";


    input.onchange =
        async () => {

            const file =
                input.files[0];

            if (!file) {
                return;
            }


            try {

                const text =
                    await file.text();

                const backup =
                    JSON.parse(text);


                if (
                    !backup.years
                ) {

                    throw new Error(
                        "Nieprawidłowy plik backupu."
                    );
                }


                if (
                    !confirm(
                        "Przywrócić dane z backupu?"
                    )
                ) {
                    return;
                }


                Object.keys(
                    backup.years
                ).forEach(
                    year => {

                        if (
                            backup.years[year].data
                        ) {

                            saveYear(
                                Number(year),
                                backup.years[year].data
                            );
                        }


                        if (
                            backup.years[year].meta
                        ) {

                            saveMeta(
                                Number(year),
                                backup.years[year].meta
                            );
                        }
                    }
                );


                render();

                setSyncPending();

                scheduleSync();


            } catch (e) {

                alert(
                    "Nie udało się przywrócić backupu:\n" +
                    e.message
                );
            }
        };


    input.click();
}


/* =========================================================
   EXCEL
   ========================================================= */

async function exportExcel() {

    const workbook =
        new ExcelJS.Workbook();

    const data =
        loadYear(currentYear);


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const sheet =
            workbook.addWorksheet(
                monthNames[month]
            );


        sheet.columns = [

            {
                header: "Data",
                key: "date",
                width: 14
            },

            {
                header: "Dzień",
                key: "day",
                width: 15
            },

            {
                header: "Od",
                key: "from",
                width: 10
            },

            {
                header: "Do",
                key: "to",
                width: 10
            },

            {
                header: "Rodzaj",
                key: "type",
                width: 15
            },

            {
                header: "Projekt",
                key: "project",
                width: 25
            },

            {
                header: "Uwagi",
                key: "note",
                width: 40
            }
        ];


        const count =
            daysInMonth(
                currentYear,
                month
            );


        for (
            let day = 1;
            day <= count;
            day++
        ) {

            const date =
                new Date(
                    currentYear,
                    month,
                    day
                );

            const key =
                dateKey(date);

            const d =
                normalizeDay(
                    data[key]
                );


            sheet.addRow({

                date:
                    key,

                day:
                    dayNames[
                        date.getDay()
                    ],

                from:
                    d.from,

                to:
                    d.to,

                type:
                    d.type,

                project:
                    d.project,

                note:
                    d.note
            });
        }


        sheet.getRow(1).font = {
            bold: true
        };

        sheet.views = [
            {
                state: "frozen",
                ySplit: 1
            }
        ];
    }


    const buffer =
        await workbook.xlsx.writeBuffer();


    const blob =
        new Blob(
            [buffer],
            {
                type:
                    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        `ewidencja_czasu_${currentYear}.xlsx`;

    a.click();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   START
   ========================================================= */

async function startApplication() {

    const today =
        new Date();


    if (
        today.getFullYear() >= MIN_YEAR &&
        today.getFullYear() <= MAX_YEAR
    ) {

        currentYear =
            today.getFullYear();
    }


    fillYears();

    selectedDates.clear();

    render();

    updateTopLayout();


    await syncAll(false);


    setTimeout(
        () => {

            const todayRow =
                document.querySelector(
                    "#app .today"
                );

            if (todayRow) {

                todayRow.scrollIntoView({

                    behavior: "auto",

                    block: "center"
                });
            }


            updateTopLayout();

        },
        150
    );
}


/* =========================================================
   INIT
   ========================================================= */

(async function init() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        document.getElementById(
            "loginScreen"
        ).style.display =
            "none";

        document.getElementById(
            "application"
        ).style.display =
            "block";


        await startApplication();

    } else {

        document.getElementById(
            "loginScreen"
        ).style.display =
            "flex";
    }


    setTimeout(
        updateTopLayout,
        100
    );

})();
</script>
