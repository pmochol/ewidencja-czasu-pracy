<!doctype html>

<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ewidencja czasu pracy</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f7;
  color:#20252b;
  font-family:Arial,sans-serif
}

header{
  background:#1f2937;
  color:white;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 2px 8px #0002
}

.head{
  max-width:1500px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

h1{
  margin:0;
  font-size:23px
}

.sub{
  font-size:12px;
  color:#cbd5e1;
  margin-top:4px
}

.controls{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap
}

button,select{
  font:inherit
}

button{
  border:0;
  border-radius:7px;
  padding:9px 12px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer
}

button.gray{
  background:#4b5563
}

button.green{
  background:#15803d
}

button.orange{
  background:#d97706
}

select{
  padding:8px;
  border-radius:6px;
  border:1px solid #cbd5e1;
  background:white
}

main{
  max-width:1500px;
  margin:18px auto;
  padding:0 14px;
  overflow-x:auto
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px
}

.card{
  background:white;
  border-radius:9px;
  padding:15px;
  box-shadow:0 1px 4px #0001
}

.label{
  font-size:12px;
  color:#6b7280
}

.value{
  font-size:23px;
  font-weight:bold;
  margin-top:5px
}

.month{
  background:white;
  border-radius:9px;
  margin-bottom:17px;
  overflow:hidden;
  box-shadow:0 1px 4px #0001
}

.month h2{
  margin:0;
  padding:12px 14px;
  background:#e9eef5;
  font-size:17px;
  border-bottom:1px solid #d8dee7
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th{
  background:#f8fafc;
  color:#475569
}

th,td{
  padding:7px;
  border-bottom:1px solid #e5e7eb;
  text-align:left
}

td input,
td select{
  width:100%;
  padding:6px;
  border:1px solid #d1d5db;
  border-radius:5px
}

/* Checkbox */
.checkbox-cell{
  width:42px;
  text-align:center
}

.checkbox-cell input{
  width:18px;
  height:18px;
  cursor:pointer
}

.select-all{
  width:18px !important;
  height:18px;
  cursor:pointer
}

.hours{
  text-align:center;
  font-weight:bold
}

.weekend{
  background:#fafafa;
  color:#6b7280
}

.holiday{
  background:#fff7ed
}

.total{
  text-align:right;
  padding:9px 14px;
  background:#f8fafc;
  font-weight:bold
}

.selection-info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  border-radius:8px;
  padding:10px 13px;
  margin-bottom:14px;
  font-size:13px;
  display:none
}

.selection-info.visible{
  display:block
}

@media(max-width:850px){
  .summary{
    grid-template-columns:repeat(2,1fr)
  }

  table{
    font-size:12px
  }

  th,td{
    padding:5px 4px
  }
}

@media(max-width:550px){
  .summary{
    grid-template-columns:1fr
  }

  .head{
    align-items:flex-start
  }

  .controls{
    width:100%
  }

  .controls button{
    flex:1
  }

  th,td{
    padding:5px 4px
  }

  /* Na telefonie trochę mniej ważne kolumny */
  th:nth-child(2),
  td:nth-child(2){
    white-space:nowrap
  }
}
</style>

</head>

<body>

<header>
<div class="head">

  <div>
    <h1>⏱ Ewidencja czasu pracy</h1>
    <div class="sub">
      Roczna ewidencja • automatyczny zapis w przeglądarce
    </div>
  </div>

  <div class="controls">

```
<label>
  Rok:
  <select id="year"></select>
</label>

<button class="green" onclick="applySelected()">
  Ustaw 07:00–15:00 dla zaznaczonych
</button>

<button class="gray" onclick="clearSelection()">
  Odznacz wszystkie
</button>

<button class="gray" onclick="clearYear()">
  Wyczyść rok
</button>
```

  </div>

</div>
</header>

<main>

<div id="selectionInfo" class="selection-info">
  Zaznaczono: <b id="selectedCount">0</b> dni
</div>

<div class="summary">

  <div class="card">
    <div class="label">Przepracowane godziny</div>
    <div class="value" id="hours">0:00</div>
  </div>

  <div class="card">
    <div class="label">Dni pracy</div>
    <div class="value" id="days">0</div>
  </div>

  <div class="card">
    <div class="label">Delegacje</div>
    <div class="value" id="delegations">0</div>
  </div>

  <div class="card">
    <div class="label">Zapis</div>
    <div class="value" id="saved" style="font-size:15px">
      Gotowe
    </div>
  </div>

</div>

<div id="months"></div>

</main>

<script>

const months=[
  "Styczeń",
  "Luty",
  "Marzec",
  "Kwiecień",
  "Maj",
  "Czerwiec",
  "Lipiec",
  "Sierpień",
  "Wrzesień",
  "Październik",
  "Listopad",
  "Grudzień"
];

const days=[
  "Nd",
  "Pn",
  "Wt",
  "Śr",
  "Cz",
  "Pt",
  "Sb"
];

const holidays={
  "01-01":"Nowy Rok",
  "01-06":"Trzech Króli",
  "04-05":"Wielkanoc",
  "04-06":"Poniedziałek Wielkanocny",
  "05-01":"Święto Pracy",
  "05-03":"3 Maja",
  "05-24":"Zielone Świątki",
  "06-04":"Boże Ciało",
  "08-15":"Wniebowzięcie",
  "11-01":"Wszystkich Świętych",
  "11-11":"Niepodległość",
  "12-24":"Wigilia",
  "12-25":"Boże Narodzenie",
  "12-26":"Drugi dzień Świąt"
};

const now=new Date();
const ys=document.getElementById("year");


/* Rok */
for(let y=2024;y<=2035;y++){

  let o=document.createElement("option");

  o.value=y;
  o.textContent=y;

  if(y===now.getFullYear()){
    o.selected=true;
  }

  ys.appendChild(o);
}

ys.onchange=function(){
  clearSelection();
  render();
};


/* Klucz daty */
function key(y,m,d){
  return y+"-"+
    String(m+1).padStart(2,"0")+"-"+
    String(d).padStart(2,"0");
}


/* Pobranie danych */
function data(){
  return JSON.parse(
    localStorage.getItem("worktime_"+ys.value)||"{}"
  );
}


/* Zapis */
function save(d){

  localStorage.setItem(
    "worktime_"+ys.value,
    JSON.stringify(d)
  );

  document.getElementById("saved").textContent="Zapisano";
}


/* Minuty */
function mins(t){

  if(!t){
    return null;
  }

  let a=t.split(":");

  return +a[0]*60 + +a[1];
}


/* Czas pracy */
function dur(a,b){

  let x=mins(a);
  let y=mins(b);

  return x!==null && y!==null && y>=x
    ? y-x
    : 0;
}


/* Format czasu */
function fmt(n){

  return Math.floor(n/60)+":"+
    String(n%60).padStart(2,"0");
}


/* Święto */
function holiday(date){

  return holidays[
    String(date.getMonth()+1).padStart(2,"0")+"-"+
    String(date.getDate()).padStart(2,"0")
  ]||"";
}


/* Weekend */
function weekend(date){

  return date.getDay()===0 ||
         date.getDay()===6;
}


/* Aktualizacja informacji o zaznaczeniu */
function updateSelectionInfo(){

  const selected=
    document.querySelectorAll(
      '.day-checkbox:checked'
    ).length;

  document.getElementById(
    "selectedCount"
  ).textContent=selected;

  const info=
    document.getElementById("selectionInfo");

  if(selected>0){
    info.classList.add("visible");
  }else{
    info.classList.remove("visible");
  }
}


/* Zaznacz/odznacz wszystkie dni w miesiącu */
function toggleMonth(checkbox){

  const table=checkbox.closest("table");

  table
    .querySelectorAll(".day-checkbox")
    .forEach(cb=>{
      cb.checked=checkbox.checked;
    });

  updateSelectionInfo();
}


/* Render */
function render(){

  let y=+ys.value;
  let d=data();

  let box=document.getElementById("months");

  box.innerHTML="";

  let all=0;
  let wd=0;
  let del=0;


  for(let m=0;m<12;m++){

    let sec=document.createElement("section");

    sec.className="month";


    /* Nagłówek miesiąca */
    sec.innerHTML=
      "<h2>"+months[m]+" "+y+"</h2>";


    let tab=document.createElement("table");


    tab.innerHTML=
      "<thead>"+
      "<tr>"+
      '<th class="checkbox-cell">'+
      '<input type="checkbox" class="select-all" '+
      'title="Zaznacz cały miesiąc" '+
      'onchange="toggleMonth(this)">'+
      "</th>"+
      "<th>Data</th>"+
      "<th>Dzień</th>"+
      "<th>Od</th>"+
      "<th>Do</th>"+
      "<th>Godziny</th>"+
      "<th>Rodzaj</th>"+
      "<th>Uwagi</th>"+
      "</tr>"+
      "</thead>"+
      "<tbody></tbody>";


    let tb=tab.querySelector("tbody");

    let mt=0;

    let n=
      new Date(y,m+1,0).getDate();


    for(let day=1;day<=n;day++){

      let dt=new Date(y,m,day);

      let k=key(y,m,day);

      let r=d[k]||{};

      let hol=holiday(dt);

      let type=
        r.type ||
        (
          hol
          ?"Święto"
          :weekend(dt)
          ?"Wolne"
          :"Praca"
        );

      let h=dur(r.from,r.to);


      mt+=h;
      all+=h;

      if(h){
        wd++;
      }

      if(h && type==="Delegacja"){
        del++;
      }


      let tr=document.createElement("tr");


      if(
        dt.toDateString()===
        now.toDateString()
      ){
        tr.id="today-row";
      }


      if(weekend(dt)){
        tr.className="weekend";
      }

      if(hol){
        tr.className+=" holiday";
      }


      tr.innerHTML=

        /* Checkbox */
        '<td class="checkbox-cell">'+
          '<input type="checkbox" '+
          'class="day-checkbox" '+
          'data-k="'+k+'">'+
        '</td>'+

        /* Data */
        "<td><b>"+
          String(day).padStart(2,"0")+
          "."+
          String(m+1).padStart(2,"0")+
          "."+
          y+
        "</b></td>"+

        /* Dzień */
        "<td>"+
          days[dt.getDay()]+
          (hol?" ★":"")+
        "</td>"+

        /* Od */
        '<td>'+
          '<input type="time" '+
          'value="'+(r.from||"")+'" '+
          'data-k="'+k+'" '+
          'data-f="from">'+
        "</td>"+

        /* Do */
        '<td>'+
          '<input type="time" '+
          'value="'+(r.to||"")+'" '+
          'data-k="'+k+'" '+
          'data-f="to">'+
        "</td>"+

        /* Godziny */
        '<td class="hours">'+
          fmt(h)+
        "</td>"+

        /* Rodzaj */
        '<td>'+
          '<select data-k="'+k+'" data-f="type">'+
            [
              "Praca",
              "Delegacja",
              "Urlop",
              "L4",
              "Święto",
              "Wolne"
            ]
            .map(x=>
              "<option "+
              (x===type?"selected":"")+
              ">"+x+"</option>"
            )
            .join("")+
          "</select>"+
        "</td>"+

        /* Uwagi */
        '<td>'+
          '<input type="text" '+
          'placeholder="np. Kraków" '+
          'value="'+
          (r.note||"")
            .replaceAll('"',"&quot;")+
          '" data-k="'+k+'" '+
          'data-f="note">'+
        "</td>";


      tb.appendChild(tr);
    }


    sec.appendChild(tab);


    let t=document.createElement("div");

    t.className="total";

    t.textContent="Suma: "+fmt(mt);

    sec.appendChild(t);


    box.appendChild(sec);
  }


  document.getElementById("hours").textContent=
    fmt(all);

  document.getElementById("days").textContent=
    wd;

  document.getElementById("delegations").textContent=
    del;


  /*
    Obsługa pól Od / Do / Rodzaj / Uwagi
  */
  document
    .querySelectorAll(
      "input[data-k],select[data-k]"
    )
    .forEach(e=>{

      e.onchange=()=>{

        let k=e.dataset.k;
        let f=e.dataset.f;

        d[k]=d[k]||{};

        d[k][f]=e.value;

        save(d);

        render();
      };

    });


  /*
    Obsługa checkboxów.
    Checkbox nie powoduje renderowania,
    więc można zaznaczać wiele dni.
  */
  document
    .querySelectorAll(".day-checkbox")
    .forEach(cb=>{

      cb.onchange=updateSelectionInfo;

    });


  updateSelectionInfo();
}


/*
  USTAW 07:00–15:00 DLA ZAZNACZONYCH
*/
function applySelected(){

  const selected=
    document.querySelectorAll(
      ".day-checkbox:checked"
    );


  if(selected.length===0){

    alert(
      "Najpierw zaznacz dni, dla których chcesz ustawić 07:00–15:00."
    );

    return;
  }


  const y=+ys.value;

  const d=data();


  selected.forEach(cb=>{

    const k=cb.dataset.k;


    d[k]={
      ...(d[k]||{}),
      from:"07:00",
      to:"15:00",
      type:"Praca"
    };

  });


  save(d);

  render();
}


/*
  Odznacz wszystkie checkboxy
*/
function clearSelection(){

  document
    .querySelectorAll(".day-checkbox")
    .forEach(cb=>{
      cb.checked=false;
    });


  document
    .querySelectorAll(".select-all")
    .forEach(cb=>{
      cb.checked=false;
    });


  updateSelectionInfo();
}


/*
  Wyczyść cały rok
*/
function clearYear(){

  if(
    confirm(
      "Wyczyścić wszystkie wpisy dla "+
      ys.value+"?"
    )
  ){

    localStorage.removeItem(
      "worktime_"+ys.value
    );

    clearSelection();

    render();
  }
}


/* Start */
render();


/* Przewiń do dzisiejszego dnia */
setTimeout(function(){

  const row=
    document.getElementById("today-row");

  if(row){

    row.scrollIntoView({
      behavior:"auto",
      block:"center"
    });

  }

},100);

</script>

</body>
</html>
